<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Treino de Digitação</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #game-container {
            border: 3px solid white;
            position: relative;
            width: 90vw;
            height: 85vh;
            max-width: 900px;
            max-height: 600px;
            background-color: black;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }
        #canvas {
            width: 100%;
            height: 100%;
        }
        #typing-area {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            max-width: 90%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
        #current-word {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 30px;
            color: #00ff00;
        }
        #input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 20px;
            text-align: center;
            outline: none;
        }
        #health-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 250px;
            height: 25px;
            border: 2px solid white;
            background-color: #440000;
            border-radius: 10px;
            overflow: hidden;
        }
        #health {
            height: 100%;
            background: linear-gradient(to right, red, yellow, green);
            width: 100%;
            transition: width 0.3s;
        }
        #score {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 18px;
        }
        #shop {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border: 3px solid white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px white;
            z-index: 10;
        }
        #shop button {
            margin: 10px;
            padding: 12px 20px;
            background: white;
            color: black;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        #shop button:hover {
            background: #ccc;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="canvas"></canvas>
        
        <div id="typing-area">
            <div id="current-word"></div>
            <input type="text" id="input" autocomplete="off" placeholder="Digite aqui...">
        </div>
        
        <div id="health-bar"><div id="health"></div></div>
        <div id="score">Pontos: 0</div>
        
        <div id="shop">
            <h2>Loja de Melhorias</h2>
            <p>Pontos disponíveis: <span id="shop-score">0</span></p>
            <button onclick="buyUpgrade('damage')">+ Dano (100 pts)</button>
            <button onclick="buyUpgrade('health')">+ Vida Máxima (200 pts)</button>
            <button onclick="buyUpgrade('speed')">+ Vel. Projétil (150 pts)</button>
            <br><br>
            <button onclick="startGame()" style="padding:15px 30px; font-size:18px;">Iniciar Nova Partida</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const input = document.getElementById('input');
        const currentWordDisplay = document.getElementById('current-word');
        const healthBar = document.getElementById('health');
        const scoreElem = document.getElementById('score');
        const shop = document.getElementById('shop');
        const shopScore = document.getElementById('shop-score');

        // Ajustar canvas ao container
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let player = { x: canvas.width / 2, y: canvas.height - 80, size: 30, color: '#00aaff' };
        let enemies = [];
        let projectiles = [];
        let words = ['casa', 'gato', 'cachorro', 'javascript', 'programar', 'digitar', 'teclado', 'inimigo', 'fogo', 'ataque', 'mundo', 'computador', 'codigo', 'jogo', 'vitoria'];
        let healthPercent = 100;
        let score = 0;
        let gameActive = true;

        let upgrades = {
            damage: 30,
            projectileSpeed: 8,
            maxHealth: 100
        };

        function getRandomWord() {
            return words[Math.floor(Math.random() * words.length)];
        }

        function createEnemy() {
            if (!gameActive) return;
            const word = getRandomWord();
            const enemy = {
                x: Math.random() * (canvas.width - 60) + 30,
                y: 30,
                size: 40,
                color: 'red',
                speed: 0.5,  // Velocidade reduzida
                word: word,
                typed: ''
            };
            // Calcular direção em direção ao jogador
            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const distance = Math.sqrt(dx*dx + dy*dy);
            enemy.vx = (dx / distance) * enemy.speed;
            enemy.vy = (dy / distance) * enemy.speed;
            enemies.push(enemy);
        }

        function drawPlayer() {
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2);
            ctx.fill();
            // Triângulo simples no topo
            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - player.size / 2);
            ctx.lineTo(player.x - 15, player.y - 5);
            ctx.lineTo(player.x + 15, player.y - 5);
            ctx.closePath();
            ctx.fill();
        }

        function drawEnemies() {
            enemies.forEach(enemy => {
                // Corpo vermelho
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x - enemy.size/2, enemy.y - enemy.size/2, enemy.size, enemy.size);
                
                // Palavra acima
                ctx.fillStyle = 'white';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                const fullText = enemy.word;
                const typedText = enemy.typed;
                const remainingText = fullText.substring(typedText.length);
                
                ctx.fillStyle = '#00ff00';
                ctx.fillText(typedText, enemy.x, enemy.y - enemy.size/2 - 10);
                ctx.fillStyle = 'white';
                ctx.fillText(remainingText, enemy.x + ctx.measureText(typedText).width, enemy.y - enemy.size/2 - 10);
            });
        }

        function drawProjectiles() {
            projectiles.forEach(proj => {
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, 6, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function updateGame() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Atualizar inimigos (movem em direção ao jogador)
            enemies = enemies.filter(enemy => {
                enemy.x += enemy.vx;
                enemy.y += enemy.vy;

                // Checou colisão com jogador?
                const distToPlayer = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                if (distToPlayer < player.size / 2 + enemy.size / 2) {
                    healthPercent -= 15;
                    updateHealth();
                    if (healthPercent <= 0) {
                        endGame();
                    }
                    return false; // Remove inimigo
                }
                return enemy.y < canvas.height + 50;
            });

            // Atualizar projéteis
            projectiles = projectiles.filter(proj => {
                proj.y -= upgrades.projectileSpeed;
                if (proj.y < -10) return false;

                for (let i = 0; i < enemies.length; i++) {
                    const enemy = enemies[i];
                    const dist = Math.hypot(proj.x - enemy.x, proj.y - enemy.y);
                    if (dist < enemy.size / 2 + 6) {
                        enemy.size -= upgrades.damage;
                        if (enemy.size <= 10) {
                            enemies.splice(i, 1);
                            score += 20;
                            updateScore();
                        }
                        return false; // Remove projétil
                    }
                }
                return true;
            });

            drawPlayer();
            drawEnemies();
            drawProjectiles();

            requestAnimationFrame(updateGame);
        }

        function updateHealth() {
            healthBar.style.width = `${healthPercent}%`;
        }

        function updateScore() {
            scoreElem.innerText = `Pontos: ${score}`;
        }

        function endGame() {
            gameActive = false;
            input.disabled = true;
            shop.style.display = 'block';
            shopScore.innerText = score;
        }

        function startGame() {
            gameActive = true;
            enemies = [];
            projectiles = [];
            healthPercent = upgrades.maxHealth;
            updateHealth();
            input.disabled = false;
            input.value = '';
            currentWordDisplay.textContent = '';
            shop.style.display = 'none';
            input.focus();
        }

        function buyUpgrade(type) {
            let cost = 0;
            if (type === 'damage') cost = 100;
            if (type === 'health') cost = 200;
            if (type === 'speed') cost = 150;

            if (score >= cost) {
                score -= cost;
                shopScore.innerText = score;
                if (type === 'damage') upgrades.damage += 10;
                if (type === 'health') {
                    upgrades.maxHealth += 30;
                }
                if (type === 'speed') upgrades.projectileSpeed += 2;
            }
        }

        // Sistema de digitação melhorado
        input.addEventListener('input', (e) => {
            const typed = e.target.value.toLowerCase().trim();

            // Encontrar inimigo que começa com o que foi digitado
            let matchedEnemy = null;
            for (const enemy of enemies) {
                if (enemy.word.toLowerCase().startsWith(typed)) {
                    matchedEnemy = enemy;
                    break; // Prioriza o primeiro que combina
                }
            }

            if (matchedEnemy) {
                matchedEnemy.typed = typed;
                currentWordDisplay.textContent = matchedEnemy.word;
                
                // Destacar parte já digitada
                if (typed.length > 0) {
                    currentWordDisplay.innerHTML = 
                        '<span style="color:#00ff00;">' + typed + '</span>' + 
                        matchedEnemy.word.substring(typed.length);
                } else {
                    currentWordDisplay.textContent = matchedEnemy.word;
                }

                // Palavra completa?
                if (typed === matchedEnemy.word.toLowerCase()) {
                    // Atirar!
                    projectiles.push({ x: player.x, y: player.y - 20 });
                    matchedEnemy.typed = '';
                    e.target.value = '';
                    currentWordDisplay.textContent = '';
                }
            } else {
                // Não combina com ninguém
                e.target.value = '';
                currentWordDisplay.textContent = '';
                for (const enemy of enemies) {
                    if (enemy.typed.length > 0) {
                        enemy.typed = '';
                    }
                }
            }
        });

        // Iniciar jogo
        startGame();
        updateGame();
        setInterval(createEnemy, 3000); // Inimigos a cada 3 segundos
    </script>
</body>
</html>
