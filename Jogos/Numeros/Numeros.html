<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Adivinhe o Número</h1>
        <p>Tente adivinhar o número secreto entre 1 e 100!</p>
        <input type="number" id="guessInput" placeholder="Digite seu palpite" min="1" max="100">
        <button id="guessButton">Enviar Palpite</button>
        <p id="message"></p>
        <p id="attempts">Tentativas: 0</p>
        <button id="restartButton" style="display: none;">Jogar Novamente</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
