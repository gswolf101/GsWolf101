<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width={device-width}, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin:0;
            height:100vh;
            background:black;
            color:white;
            display:flex;
            flex-direction:column;
        }
        #centro {
            text-align: center;
            margin: auto;
        } 
        #button {
            background: black;
            border: 3px solid red;
            color: red;
            text-align: center;
        }

        #button:hover {
            border: 4px solid white;
            color: white;
            text-align: center;
        } 
        #lista {
          list-style:none;
          padding:0;
          margin:0;
          display:grid;
          grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
          gap:20px;
          width:100%;
          max-width:600px;
        }
    </style>
</head>
<body>
    <div id="centro">
        <ul>
            <li><a href="#" id="button">reflexo</a></li>
        </ul>
    </div>
</body>
</html>
