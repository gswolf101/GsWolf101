<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaja</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            transition: background-color 0.5s;
            position: relative;
        }
        #voltar {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px 20px;
            font-size: 1.2em;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 100;
        }
        #voltar:hover { background: #555; }
        #menu { text-align: center; }
        #menu button {
            padding: 20px 40px;
            font-size: 2em;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }
        #menu button:hover { background: #45a049; }
        #game {
            display: none;
            text-align: center;
            width: 100%;
        }
        #mensagem {
            font-size: 3em;
            margin: 30px 0;
            color: white;
        }
        #resultado {
            font-size: 4em;
            font-weight: bold;
            margin: 20px 0;
        }
        #recorde {
            font-size: 1.8em;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #333;
        }
    </style>
</head>
<body>
    <button id="voltar" onclick="window.location.href='../reflexos/lobby.html'">← Voltar</button>

    <div id="recorde">
        Recorde: <span id="bestTime">--</span> ms
    </div>

    <div id="menu">
        <h1>Tempo de Reação</h1>
        <button id="startBtn">COMEÇAR</button>
    </div>

    <div id="game">
        <div id="mensagem">Espere ficar verde...</div>
        <div id="resultado"></div>
    </div>

    <script>
        const STORAGE_KEY = 'reaction_best';
        const menu = document.getElementById('menu');
        const game = document.getElementById('game');
        const mensagem = document.getElementById('mensagem');
        const resultado = document.getElementById('resultado');
        const bestTimeSpan = document.getElementById('bestTime');
        const startBtn = document.getElementById('startBtn');

        let inicio;
        let timeoutId;
        let jogoAtivo = false;

        // Carrega recorde salvo
        const best = localStorage.getItem(STORAGE_KEY);
        if (best) bestTimeSpan.textContent = best;

        function startGame() {
            menu.style.display = 'none';
            game.style.display = 'block';
            resultado.textContent = '';
            document.body.style.backgroundColor = 'red';
            mensagem.textContent = 'Espere ficar verde...';
            jogoAtivo = true;

            const delay = Math.random() * 5000 + 2000;
            timeoutId = setTimeout(goGreen, delay);
        }

        function goGreen() {
            if (!jogoAtivo) return;
            document.body.style.backgroundColor = 'green';
            mensagem.textContent = 'CLIQUE AGORA!';
            inicio = Date.now();
        }

        function tooEarly() {
            jogoAtivo = false;
            clearTimeout(timeoutId);
            document.body.style.backgroundColor = '#ff4444';
            mensagem.textContent = 'ERROU!';
            resultado.textContent = 'Clicou muito cedo!';
            resultado.style.color = 'white';
            setTimeout(backToMenu, 2500);
        }

        function success() {
            jogoAtivo = false;
            const tempo = Date.now() - inicio;
            document.body.style.backgroundColor = '#44ff44';
            mensagem.textContent = 'Ótimo!';
            resultado.textContent = `${tempo} ms`;
            resultado.style.color = 'white';

            const best = localStorage.getItem(STORAGE_KEY);
            if (!best || tempo < parseInt(best)) {
                localStorage.setItem(STORAGE_KEY, tempo);
                bestTimeSpan.textContent = tempo;
                resultado.textContent = `${tempo} ms (NOVO RECORDE!)`;
            }

            setTimeout(backToMenu, 3000);
        }

        function backToMenu() {
            jogoAtivo = false;
            menu.style.display = 'block';
            game.style.display = 'none';
            document.body.style.backgroundColor = '#f0f0f0';
        }

        startBtn.addEventListener('click', startGame);

        document.body.addEventListener('click', function handler(e) {
            if (!jogoAtivo) return;
            if (e.target === startBtn) return;

            if (document.body.style.backgroundColor === 'red') {
                tooEarly();
            } else if (document.body.style.backgroundColor === 'green') {
                success();
            }
        });
    </script>
</body>
</html>
