<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clique na Máscara</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: white;
            position: relative;
        }
        #voltar {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px 20px;
            font-size: 1.2em;
            background: #333;
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            z-index: 100;
        }
        #voltar:hover { background: #555; }
        #highs { 
            text-align: center; 
            margin-bottom: 20px; 
            font-size: 1.2em; 
            color: white;
        }
        #menu { text-align: center; }
        #menu h2 { color: white; }
        #menu button {
            display: block; 
            margin: 10px auto; 
            padding: 15px 30px;
            font-size: 1.5em; 
            background: #ff6600; 
            color: white;
            border: 2px solid white;
            border-radius: 10px; 
            cursor: pointer;
        }
        #menu button:hover { background: #ff8833; }
        #gameInfo {
            display: none; 
            flex-direction: column; 
            align-items: center;
            font-size: 2em; 
            position: absolute; 
            top: 60px;
            color: white;
        }
        #timer, #currentScore { 
            font-size: 3em; 
            margin: 5px; 
            text-shadow: 0 0 10px white;
        }
        .mascara-container {
            width: 180px; 
            height: 180px; 
            position: fixed; 
            cursor: pointer; 
            z-index: 10;
            display: none;
        }
        .mascara-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: contain; 
        }
    </style>
</head>
<body>
    <button id="voltar" onclick="window.location.href='/lobby.html'">← Voltar</button>

    <div id="highs">
        Melhor clique: <span id="bestSingle">--</span> ms<br>
        Recordes:<br>
        10s: <span id="high10">0</span> | 30s: <span id="high30">0</span> | 60s: <span id="high60">0</span>
    </div>
    <div id="menu">
        <h2>Escolha o desafio:</h2>
        <button onclick="startGame(10)">10 Segundos</button>
        <button onclick="startGame(30)">30 Segundos</button>
        <button onclick="startGame(60)">60 Segundos</button>
    </div>
    <div id="gameInfo">
        <div id="timer">--</div>
        <div id="currentScore">0</div>
    </div>

    <!-- Duas máscaras no máximo -->
    <div id="mascara1" class="mascara-container"><img src="../../imagens/Mascara_GsWolf101.png" alt="Máscara"></div>
    <div id="mascara2" class="mascara-container"><img src="../../imagens/Mascara_GsWolf101.png" alt="Máscara"></div>

    <script>
        const STORAGE_PREFIX = 'shape_';
        const mascaras = [
            document.getElementById('mascara1'),
            document.getElementById('mascara2')
        ];
        let gameActive = false;
        let endTime = 0;
        let count = 0;
        let sessionBest = Infinity;
        let currentDuration = 0;
        let timerInterval;
        let activeMascaras = 0;
        let nextAppearTimeout;

        function loadHighs() {
            document.getElementById('bestSingle').textContent = localStorage.getItem(STORAGE_PREFIX + 'best_single') || '--';
            document.getElementById('high10').textContent = localStorage.getItem(STORAGE_PREFIX + 'high_10') || 0;
            document.getElementById('high30').textContent = localStorage.getItem(STORAGE_PREFIX + 'high_30') || 0;
            document.getElementById('high60').textContent = localStorage.getItem(STORAGE_PREFIX + 'high_60') || 0;
        }

        function saveBestSingle(time) {
            const key = STORAGE_PREFIX + 'best_single';
            const best = localStorage.getItem(key);
            if (!best || time < parseInt(best)) {
                localStorage.setItem(key, time);
                document.getElementById('bestSingle').textContent = time;
            }
        }

        function saveHigh(duration, score) {
            const key = STORAGE_PREFIX + 'high_' + duration;
            const high = parseInt(localStorage.getItem(key) || 0);
            if (score > high) {
                localStorage.setItem(key, score);
                document.getElementById('high' + duration).textContent = score;
            }
        }

        function posicionarMascara(container) {
            const margem = 200;
            container.style.top = Math.random() * (window.innerHeight - margem) + 'px';
            container.style.left = Math.random() * (window.innerWidth - margem) + 'px';
            container.style.display = 'block';
            activeMascaras++;
        }

        function esconderMascara(container) {
            container.style.display = 'none';
            activeMascaras--;
            if (gameActive && activeMascaras < 2) {
                agendarNovaMascara();
            }
        }

        function agendarNovaMascara() {
            if (nextAppearTimeout || activeMascaras >= 2 || !gameActive) return;
            const delay = Math.random() * 800 + 400; // 400ms a 1200ms
            nextAppearTimeout = setTimeout(aparecerMascara, delay);
        }

        function aparecerMascara() {
            if (!gameActive || activeMascaras >= 2) return;
            nextAppearTimeout = null;

            // Encontra uma máscara escondida
            const escondida = mascaras.find(m => m.style.display === 'none');
            if (escondida) {
                posicionarMascara(escondida);
                esconderMascara.timeStart = Date.now(); // Salva tempo de aparição
                esconderMascara.container = escondida;
            }

            // Agenda a próxima se ainda tiver espaço
            if (activeMascaras < 2) agendarNovaMascara();
        }

        function startGame(duration) {
            currentDuration = duration;
            gameActive = true;
            endTime = Date.now() + duration * 1000;
            count = 0;
            sessionBest = Infinity;
            activeMascaras = 0;
            clearTimeout(nextAppearTimeout);
            nextAppearTimeout = null;

            document.getElementById('menu').style.display = 'none';
            document.getElementById('gameInfo').style.display = 'flex';
            document.getElementById('currentScore').textContent = '0';
            document.getElementById('timer').textContent = duration;

            mascaras.forEach(m => m.style.display = 'none');

            timerInterval = setInterval(updateTimer, 100);

            // Aparece a primeira rapidamente
            setTimeout(aparecerMascara, 500);
            agendarNovaMascara();
        }

        function updateTimer() {
            if (!gameActive) return;
            const left = Math.ceil((endTime - Date.now()) / 1000);
            document.getElementById('timer').textContent = left;
            if (left <= 0) endGame();
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            clearTimeout(nextAppearTimeout);
            mascaras.forEach(m => m.style.display = 'none');
            activeMascaras = 0;
            saveHigh(currentDuration, count);
            setTimeout(() => {
                document.getElementById('menu').style.display = 'block';
                document.getElementById('gameInfo').style.display = 'none';
            }, 2000);
        }

        // Clique em qualquer máscara
        mascaras.forEach(container => {
            container.addEventListener('click', () => {
                if (!gameActive || container.style.display === 'none') return;

                const tempo = Date.now() - (container.timeStart || Date.now());
                if (tempo < sessionBest) sessionBest = tempo;
                saveBestSingle(tempo);

                count++;
                document.getElementById('currentScore').textContent = count;

                esconderMascara(container);
            });
        });

        loadHighs();
    </script>
</body>
</html>
