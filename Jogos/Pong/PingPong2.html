<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="startScreen">
        <h1>Pong</h1>
        <button id="singlePlayerBtn">Single Player</button>
        <button id="multiPlayerBtn">Multiplayer</button>
    </div>
    <div id="gameScreen" style="display: none;">
        <canvas id="pongCanvas" width="800" height="600"></canvas>
        <div id="lives">
            <span id="leftLives">Vidas: 3</span>
            <span id="rightLives" style="display: none;">Vidas: 3</span>
        </div>
        <div id="gameOver" style="display: none;">
            <h2>Fim de Jogo!</h2>
            <p id="gameOverMessage"></p>
            <button id="restartBtn">Jogar Novamente</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
