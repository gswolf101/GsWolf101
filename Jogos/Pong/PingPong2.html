<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Pong</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="startScreen" class="screen">
        <h2>Ping Pong</h2>
        <button id="singlePlayerBtn">Single Player</button>
        <button id="multiPlayerBtn">Multiplayer</button>
    </div>
    <div id="singlePlayerStartScreen" class="screen" style="display: none;">
        <h2>Single Player</h2>
        <ul id="initialRankingList"></ul>
        <button id="startSinglePlayerGameBtn">Começar</button>
        <button id="backToMenuSinglePlayerBtn">Voltar</button>
    </div>
    <div id="multiplayerStartScreen" class="screen" style="display: none;">
        <h2>Multiplayer</h2>
        <button id="startMultiplayerGameBtn">Começar</button>
        <button id="backToMenuMultiplayerBtn">Voltar</button>
    </div>
    <div id="gameScreen" style="display: none;">
        <canvas id="pongCanvas" width="800" height="600"></canvas>
        <div id="leftLives">
            <div id="leftLife1" class="life"></div>
            <div id="leftLife2" class="life"></div>
            <div id="leftLife3" class="life"></div>
        </div>
        <div id="rightLives">
            <div id="rightLife1" class="life"></div>
            <div id="rightLife2" class="life"></div>
            <div id="rightLife3" class="life"></div>
        </div>
        <div id="scoreGoalsContainer">
            <div id="scoreDisplay">Pontos: <span id="currentScore">0</span></div>
            <div id="goalsDisplay">Gols: <span id="currentGoals">0</span></div>
        </div>
        <div id="leftPower" class="power-display">Poder: Nenhum</div>
        <div id="rightPower" class="power-display">Poder: Nenhum</div>
    </div>
    <div id="gameOver" class="screen" style="display: none;">
        <h2 id="gameOverMessage"></h2>
        <div id="finalScore"></div>
        <div id="rankingSection">
            <input type="text" id="playerName" placeholder="Digite seu nome">
            <button id="saveScoreBtn">Salvar Pontuação</button>
        </div>
        <div id="finalRanking" style="display: none;">
            <h3>Ranking</h3>
            <ul id="finalRankingList"></ul>
        </div>
        <button id="rematchBtn">Revanche</button>
        <button id="backToMenuBtn">Voltar ao Menu</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
