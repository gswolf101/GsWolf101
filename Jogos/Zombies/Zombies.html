<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Sobrevivência a Zumbis</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
        }
        #gameCanvas {
            background: #333;
            display: block;
        }
        #healthBar {
            width: 800px;
            height: 20px;
            background: #555;
            border: 2px solid #000;
            position: absolute;
            top: -30px;
        }
        #health {
            height: 100%;
            background: #f00;
            width: 100%;
        }
        #score {
            position: absolute;
            top: -50px;
            left: 10px;
            color: white;
            font-size: 20px;
        }
        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-size: 40px;
            text-align: center;
        }
        #gameOver button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
        }
        #ranking, #shop {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #444;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        #ranking ul {
            list-style: none;
            padding: 0;
        }
        #shop button {
            margin: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="healthBar"><div id="health"></div></div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="score">Pontos: 0 | Moedas: 0</div>
        <div id="gameOver">
            Game Over!<br>
            <button onclick="showRanking()">Adicionar ao Ranking</button><br>
            <button onclick="resetGame()">Recomeçar</button><br>
            <button onclick="showShop()">Loja</button>
        </div>
        <div id="ranking">
            <h2>Ranking</h2>
            <ul id="rankingList"></ul>
            <button onclick="closeRanking()">Fechar</button>
        </div>
        <div id="shop">
            <h2>Loja</h2>
            <p>Moedas: <span id="shopCoins">0</span></p>
            <p>Vida Extra (50 moedas): <button onclick="buyHealth()">Comprar</button></p>
            <p>Tiro Rápido (<span id="fireRateCost">200</span> moedas): <button onclick="buyFireRate()">Comprar</button></p>
            <p>Glock (100 moedas, 1.2s): <button onclick="buyGlock()">Comprar</button></p>
            <p>Rifle (250 moedas, 1s): <button onclick="buyRifle()">Comprar</button></p>
            <button onclick="closeShop()">Fechar</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const gameOverDisplay = document.getElementById('gameOver');
        const rankingDisplay = document.getElementById('ranking');
        const rankingList = document.getElementById('rankingList');
        const shopDisplay = document.getElementById('shop');
        const shopCoins = document.getElementById('shopCoins');
        const healthBar = document.getElementById('health');
        const fireRateCostDisplay = document.getElementById('fireRateCost');

        let player = { x: 400, y: 300, size: 20, speed: 5, health: 10, maxHealth: 10 };
        let zombies = [];
        let bullets = [];
        let coins = [];
        let score = 0;
        let coinCount = 0;
        let gameOver = false;
        let lastShot = 0;
        let lastSpawn = 0;
        let shootDelay = 2000; // 2 segundos entre disparos
        let fireRateCost = 200; // Custo inicial do upgrade de tiro rápido
        const spawnInterval = 4000; // 4 segundos

        // Carregar dados do localStorage
        const savedData = JSON.parse(localStorage.getItem('zombieGameData')) || {
            coins: 0,
            maxHealth: 10,
            shootDelay: 2000,
            fireRateCost: 200,
            ranking: []
        };
        coinCount = savedData.coins;
        player.maxHealth = savedData.maxHealth;
        player.health = player.maxHealth;
        shootDelay = savedData.shootDelay;
        fireRateCost = savedData.fireRateCost || 200;
        fireRateCostDisplay.textContent = fireRateCost;

        const keys = {
            w: false,
            a: false,
            s: false,
            d: false,
            ArrowUp: false,
            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false
        };

        // Manipulação de teclas
        document.addEventListener('keydown', (e) => {
            if (e.key in keys) keys[e.key] = true;
            if (e.key === 'r' && gameOver) resetGame();
        });
        document.addEventListener('keyup', (e) => {
            if (e.key in keys) keys[e.key] = false;
        });

        // Função para salvar dados no localStorage
        function saveData() {
            localStorage.setItem('zombieGameData', JSON.stringify({
                coins: coinCount,
                maxHealth: player.maxHealth,
                shootDelay: shootDelay,
                fireRateCost: fireRateCost,
                ranking: savedData.ranking
            }));
        }

        // Função para criar zumbis
        function spawnZombies() {
            const now = Date.now();
            if (now - lastSpawn < spawnInterval) return;
            lastSpawn = now;

            let zombieCount;
            if (score <= 10) {
                zombieCount = 2;
            } else if (score <= 20) {
                zombieCount = 3;
            } else if (score <= 30) {
                zombieCount = 4;
            } else {
                zombieCount = 5;
            }

            for (let i = 0; i < zombieCount; i++) {
                const side = Math.floor(Math.random() * 4);
                let x, y;
                if (side === 0) { x = Math.random() * canvas.width; y = -20; }
                else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height + 20; }
                else if (side === 2) { x = -20; y = Math.random() * canvas.height; }
                else { x = canvas.width + 20; y = Math.random() * canvas.height; }
                zombies.push({ x, y, size: 20, speed: 2 });
            }
        }

        // Função para criar moeda
        function spawnCoin(x, y) {
            if (Math.random() < 0.3) {
                coins.push({ x, y, size: 10 });
            }
        }

        // Função para atirar
        function shoot() {
            const now = Date.now();
            if (now - lastShot < shootDelay) return;
            lastShot = now;

            let dx = 0, dy = 0;
            if (keys.ArrowUp) dy -= 1;
            if (keys.ArrowDown) dy += 1;
            if (keys.ArrowLeft) dx -= 1;
            if (keys.ArrowRight) dx += 1;

            if (dx !== 0 || dy !== 0) {
                const length = Math.sqrt(dx * dx + dy * dy);
                dx /= length;
                dy /= length;
                bullets.push({ x: player.x, y: player.y, dx: dx * 7, dy: dy * 7 });
            }
        }

        // Função de atualização do jogo
        function update() {
            if (gameOver) return;

            // Movimento do jogador
            if (keys.w && player.y > player.size) player.y -= player.speed;
            if (keys.s && player.y < canvas.height - player.size) player.y += player.speed;
            if (keys.a && player.x > player.size) player.x -= player.speed;
            if (keys.d && player.x < canvas.width - player.size) player.x += player.speed;

            // Atirar
            if (keys.ArrowUp || keys.ArrowDown || keys.ArrowLeft || keys.ArrowRight) shoot();

            // Atualizar balas
            bullets.forEach(bullet => {
                bullet.x += bullet.dx;
                bullet.y += bullet.dy;
            });
            bullets = bullets.filter(b => b.x > 0 && b.x < canvas.width && b.y > 0 && b.y < canvas.height);

            // Atualizar zumbis
            zombies.forEach(zombie => {
                const dx = player.x - zombie.x;
                const dy = player.y - zombie.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                zombie.x += (dx / distance) * zombie.speed;
                zombie.y += (dy / distance) * zombie.speed;

                // Colisão com jogador
                if (distance < player.size + zombie.size) {
                    player.health -= 5;
                    zombies = zombies.filter(z => z !== zombie);
                    healthBar.style.width = `${(player.health / player.maxHealth) * 100}%`;
                    if (player.health <= 0) {
                        gameOver = true;
                        gameOverDisplay.style.display = 'block';
                    }
                }

                // Colisão com balas
                bullets.forEach((bullet, bIndex) => {
                    const bDistance = Math.sqrt((bullet.x - zombie.x) ** 2 + (bullet.y - zombie.y) ** 2);
                    if (bDistance < zombie.size) {
                        zombies = zombies.filter(z => z !== zombie);
                        bullets.splice(bIndex, 1);
                        score += 1;
                        spawnCoin(zombie.x, zombie.y);
                        scoreDisplay.textContent = `Pontos: ${score} | Moedas: ${coinCount}`;
                    }
                });
            });

            // Colisão com moedas
            coins = coins.filter(coin => {
                const distance = Math.sqrt((player.x - coin.x) ** 2 + (player.y - coin.y) ** 2);
                if (distance < player.size + coin.size) {
                    coinCount += 1;
                    scoreDisplay.textContent = `Pontos: ${score} | Moedas: ${coinCount}`;
                    saveData();
                    return false;
                }
                return true;
            });

            // Gerar zumbis
            spawnZombies();
        }

        // Função de desenho
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar jogador
            ctx.fillStyle = 'blue';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();

            // Desenhar zumbis
            ctx.fillStyle = 'green';
            zombies.forEach(zombie => {
                ctx.beginPath();
                ctx.arc(zombie.x, zombie.y, zombie.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Desenhar balas
            ctx.fillStyle = 'red';
            bullets.forEach(bullet => {
                ctx.beginPath();
                ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Desenhar moedas
            ctx.fillStyle = 'gold';
            coins.forEach(coin => {
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, coin.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Função para reiniciar o jogo
        function resetGame() {
            player = { x: 400, y: 300, size: 20, speed: 5, health: player.maxHealth, maxHealth: player.maxHealth };
            zombies = [];
            bullets = [];
            coins = [];
            score = 0;
            gameOver = false;
            lastSpawn = 0;
            gameOverDisplay.style.display = 'none';
            rankingDisplay.style.display = 'none';
            shopDisplay.style.display = 'none';
            scoreDisplay.textContent = `Pontos: ${score} | Moedas: ${coinCount}`;
            healthBar.style.width = '100%';
        }

        // Função para exibir o ranking
        function showRanking() {
            savedData.ranking.push({ score, date: new Date().toLocaleString() });
            savedData.ranking.sort((a, b) => b.score - a.score);
            savedData.ranking = savedData.ranking.slice(0, 5);
            saveData();

            rankingList.innerHTML = '';
            savedData.ranking.forEach(entry => {
                const li = document.createElement('li');
                li.textContent = `Pontos: ${entry.score} - ${entry.date}`;
                rankingList.appendChild(li);
            });
            gameOverDisplay.style.display = 'none';
            rankingDisplay.style.display = 'block';
        }

        // Função para fechar o ranking
        function closeRanking() {
            rankingDisplay.style.display = 'none';
            gameOverDisplay.style.display = 'block';
        }

        // Função para exibir a loja
        function showShop() {
            shopCoins.textContent = coinCount;
            fireRateCostDisplay.textContent = fireRateCost;
            gameOverDisplay.style.display = 'none';
            shopDisplay.style.display = 'block';
        }

        // Função para fechar a loja
        function closeShop() {
            shopDisplay.style.display = 'none';
            gameOverDisplay.style.display = 'block';
        }

        // Funções da loja
        function buyHealth() {
            if (coinCount >= 50) {
                coinCount -= 50;
                player.maxHealth += 50;
                player.health = player.maxHealth;
                shopCoins.textContent = coinCount;
                healthBar.style.width = '100%';
                saveData();
                alert('Vida extra comprada! Vida máxima: ' + player.maxHealth);
            } else {
                alert('Moedas insuficientes!');
            }
        }

        function buyFireRate() {
            if (coinCount >= fireRateCost) {
                coinCount -= fireRateCost;
                shootDelay = Math.max(50, shootDelay - 50);
                fireRateCost = Math.round(fireRateCost * 1.15); // Aumenta o custo em 0.15x
                shopCoins.textContent = coinCount;
                fireRateCostDisplay.textContent = fireRateCost;
                saveData();
                alert('Tiro rápido comprado! Atraso de tiro: ' + shootDelay + 'ms');
            } else {
                alert('Moedas insuficientes!');
            }
        }

        function buyGlock() {
            if (coinCount >= 100) {
                coinCount -= 100;
                shootDelay = 1200; // 1.2 segundos
                shopCoins.textContent = coinCount;
                saveData();
                alert('Glock comprada! Atraso de tiro: 1200ms');
            } else {
                alert('Moedas insuficientes!');
            }
        }

        function buyRifle() {
            if (coinCount >= 250) {
                coinCount -= 250;
                shootDelay = 1000; // 1 segundo
                shopCoins.textContent = coinCount;
                saveData();
                alert('Rifle comprado! Atraso de tiro: 1000ms');
            } else {
                alert('Moedas insuficientes!');
            }
        }

        // Loop principal
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
