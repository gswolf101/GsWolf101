<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Sobrevivência a Zumbis</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #gameCanvas {
            background: #333;
            display: block;
            width: 1000px;
            height: 750px;
            max-width: 100%;
            max-height: 100vh;
        }
        #healthBar {
            width: 1000px;
            height: 20px;
            background: #555;
            border: 2px solid #000;
            position: absolute;
            top: -30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #health {
            height: 100%;
            background: #f00;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #healthText {
            position: relative;
            z-index: 2;
            color: white;
            font-size: 14px;
            text-shadow: 1px 1px 1px #000;
        }
        #xpBar {
            width: 1000px;
            height: 20px;
            background: #555;
            border: 2px solid #000;
            position: absolute;
            top: -60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #xp {
            height: 100%;
            background: #0f0;
            width: 0%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #xpText {
            position: relative;
            z-index: 2;
            color: white;
            font-size: 14px;
            text-shadow: 1px 1px 1px #000;
        }
        #score {
            position: absolute;
            top: -80px;
            left: 10px;
            color: white;
            font-size: 20px;
        }
        #countdown {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-size: 48px;
            text-shadow: 2px 2px 2px #000;
            z-index: 10;
        }
        #startScreen, #gameOver, #ranking, #shop, #upgradeMenu {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #444;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        #startScreen {
            display: block;
        }
        #gameOver button, #startScreen button, #ranking button, #shop button, #upgradeMenu button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
        }
        #shop button#resetAllBtn {
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #shop button#resetAllBtn:hover {
            background-color: #cc0000;
        }
        #ranking ul {
            list-style: none;
            padding: 0;
        }
        .raro { background-color: green; color: white; }
        .normal { background-color: blue; color: white; }
        .epico { background-color: purple; color: white; }
                shopCoins.textContent = coinCount;
                updateWeaponButtons();
                saveData();
                alert('Glock comprada e equipada! Atraso de tiro: ' + shootDelay + 'ms');
                restoreCanvasFocus();
            } else if (hasGlock && equippedWeapon !== 'glock') {
                equippedWeapon = 'glock';
                updateShootDelay();
                updateWeaponButtons();
                saveData();
                alert('Glock equipada! Atraso de tiro: ' + shootDelay + 'ms');
                restoreCanvasFocus();
            } else if (!hasGlock) {
                alert('Moedas insuficientes!');
                restoreCanvasFocus();
            }
        }

        function buyRifle() {
            if (!hasRifle && coinCount >= 250) {
                coinCount -= 250;
                hasRifle = true;
                equippedWeapon = 'rifle';
                updateShootDelay();
                shopCoins.textContent = coinCount;
                updateWeaponButtons();
                saveData();
                alert('Rifle Velho comprado e equipado! Atraso de tiro: ' + shootDelay + 'ms');
                restoreCanvasFocus();
            } else if (hasRifle && equippedWeapon !== 'rifle') {
                equippedWeapon = 'rifle';
                updateShootDelay();
                updateWeaponButtons();
                saveData();
                alert('Rifle Velho equipado! Atraso de tiro: ' + shootDelay + 'ms');
                restoreCanvasFocus();
            } else if (!hasRifle) {
                alert('Moedas insuficientes!');
                restoreCanvasFocus();
            }
        }

        function buyInitialUpgrade() {
            if (coinCount >= 100 && !hasInitialUpgrade) {
                coinCount -= 100;
                hasInitialUpgrade = true;
                shopCoins.textContent = coinCount;
                buyInitialUpgradeBtn.disabled = true;
                buyInitialUpgradeBtn.textContent = "Comprado";
                saveData();
                alert('Upgrade Inicial comprado! Você receberá um upgrade aleatório no início de cada partida.');
                restoreCanvasFocus();
            } else if (hasInitialUpgrade) {
                alert('Upgrade Inicial já comprado!');
                restoreCanvasFocus();
            } else {
                alert('Moedas insuficientes!');
                restoreCanvasFocus();
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Foco inicial no canvas
        canvas.focus();
        console.log('Canvas focado ao carregar');
        gameLoop();
    </script>
</body>
</html>
