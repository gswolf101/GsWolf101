<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centergun</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; margin: 0; background-color: #222; color: #fff; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
        #game-container { position: relative; margin-top: 10px; flex: 1; display: flex; justify-content: center; align-items: center; width: 100%; max-width: 800px; }
        canvas { background-color: #333; border: 2px solid #fff; display: block; width: 100%; max-height: 65vh; }
        #game-controls { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; }
        #game-controls button { pointer-events: auto; }
        #endGameBtn { background: #ff4444; color: white; padding: 6px 10px; font-size: 12px; border: none; border-radius: 5px; cursor: pointer; }
        #endGameBtn:hover { background: #cc0000; }
        #speedToggle { background: #555; color: white; padding: 6px 10px; font-size: 12px; border: none; border-radius: 5px; cursor: pointer; }
        #speedToggle.active { background: #ff4444; }
        #game-info { margin: 10px 0; width: 100%; max-width: 800px; text-align: center; }
        #health-container { margin: 10px 0; width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        #health-bar-container { flex: 1; height: 20px; background: #555; border: 1px solid #fff; min-width: 300px; }
        #health-bar { height: 100%; background: #4CAF50; width: 100%; transition: width 0.3s; }
        #color-container { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
        #upgrades-tabs { margin: 10px 0; text-align: center; width: 100%; max-width: 800px; }
        .tab-button { background: #555; color: white; border: none; padding: 10px 20px; margin: 0 5px; cursor: pointer; border-radius: 5px 5px 0 0; }
        .tab-button.active { background: #4CAF50; }
        #upgrades-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; width: 100%; max-width: 800px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 0 5px 5px 5px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        button { background: #4CAF50; color: white; border: none; padding: 8px 12px; margin: 5px; cursor: pointer; border-radius: 5px; font-size: 14px; }
        button:hover { background: #45a049; }
        button:disabled { background: #666; cursor: not-allowed; }
        .icon { margin-right: 5px; font-size: 1.1em; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 30px; text-align: center; display: none; z-index: 10; border-radius: 10px; max-width: 90%; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
        @media (max-width: 600px) { #health-container { flex-direction: column; } #upgrades-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game-controls">
            <button id="endGameBtn">Encerrar</button>
            <button id="speedToggle">2x (OFF)</button>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="game-info">
        <div id="wave">Onda: 1</div>
        <div id="stats">
            <span class="icon">🪙</span> Cobre: <span id="statCopper">0</span> | 
            <span class="icon">🥇</span> Ouro: <span id="statGold">0</span>
        </div>
    </div>

    <div id="health-container">
        <div>
            Vida da Torre:
            <div id="health-bar-container"><div id="health-bar"></div></div>
        </div>
        <div id="color-container">
            Cor da Torre: <input type="color" id="color-picker" value="#0000FF">
        </div>
    </div>

    <div id="upgrades-tabs">
        <button class="tab-button active" data-tab="attack">Ataque</button>
        <button class="tab-button" data-tab="vida">Vida</button>
        <button class="tab-button" data-tab="defesa">Defesa</button>
        <button class="tab-button" data-tab="ganhos">Ganhos</button>
    </div>

    <div id="upgrades-grid">
        <div class="tab-content active" id="tab-attack">
            <button id="metaDamage">Dano +1 (20 Ouro) Lv.<span id="lvDamage">0</span></button>
            <button id="upgradeDamageTemp">Dano +2 (5 Cobre)</button>
            <button id="metaFireRate">Velocidade Ataque +1 (30 Ouro) Lv.<span id="lvFireRate">0</span></button>
            <button id="upgradeFireRateTemp">Taxa +50ms (5 Cobre)</button>
            <button id="metaRange">Alcance +1 (40 Ouro) Lv.<span id="lvRange">0</span></button>
            <button id="upgradeRangeTemp">Alcance +25 (5 Cobre)</button>
            <button id="metaCritChance">Crítico +1% (50 Ouro) Lv.<span id="lvCritChance">0</span></button>
        </div>
        <div class="tab-content" id="tab-vida">
            <button id="metaHealth">Vida Máx +1 (50 Ouro) Lv.<span id="lvHealth">0</span></button>
            <button id="upgradeHealthTemp">Vida +10 (5 Cobre)</button>
            <button id="metaRegen">Regen +0.1/s (60 Ouro) Lv.<span id="lvRegen">0</span></button>
        </div>
        <div class="tab-content" id="tab-defesa">
            <button id="metaDamageReduction">Redução Dano +1 (70 Ouro) Lv.<span id="lvDamageReduction">0</span></button>
            <button id="metaDodgeChance">Esquiva +0.5% (80 Ouro) Lv.<span id="lvDodgeChance">0</span></button>
        </div>
        <div class="tab-content" id="tab-ganhos">
            <button id="metaGoldWave">Ouro/Onda +1 (50 Ouro) Lv.<span id="lvGoldWave">0</span></button>
            <button id="metaCopperWave">Cobre/Onda +5 (40 Ouro) Lv.<span id="lvCopperWave">0</span></button>
            <button id="metaCopperKill">Cobre/Kill +1 (45 Ouro) Lv.<span id="lvCopperKill">0</span></button>
            <button id="metaGoldKillChance">Chance Ouro/Kill +0.5% (60 Ouro) Lv.<span id="lvGoldKillChance">0</span></button>
            <button id="metaGoldKillAmount">Ouro/Kill +1 (100 Ouro) Lv.<span id="lvGoldKillAmount">0</span></button>
            <button id="metaStartingGold">Inicial +50 (150 Ouro) Lv.<span id="lvStartingGold">0</span></button>
        </div>
    </div>

    <div id="game-over">
        <h2>Game Over!</h2>
        <p>Ondas Sobrevividas: <span id="finalWave">0</span></p>
        <p>Recorde: <span id="highScoreUI">0</span></p>
        <p>Ouro Total: <span id="totalGold">0</span> | Ganho nesta run: <span id="runGoldEarned">0</span></p>
        <button id="restart">Iniciar Nova Partida</button>
        <button id="prestigeReset">Resetar Atributos (Prestígio)</button>
        <div id="prestigeConfirm" style="display:none; margin-top:15px;">
            Digite 'gswolf101' para confirmar:<br>
            <input type="text" id="prestigeInput">
            <button id="confirmPrestige">Confirmar</button>
        </div>
    </div>

    <script>
        // === ELEMENTOS DO DOM ===
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const waveElement = document.getElementById('wave');
        const statCopper = document.getElementById('statCopper');
        const statGold = document.getElementById('statGold');
        const statDamage = document.getElementById('statDamage');
        const statFireRate = document.getElementById('statFireRate');
        const statRange = document.getElementById('statRange');
        const statMaxHealth = document.getElementById('statMaxHealth');
        const statRegen = document.getElementById('statRegen');
        const healthBar = document.getElementById('health-bar');
        const speedToggle = document.getElementById('speedToggle');
        const colorPicker = document.getElementById('color-picker');
        const endGameBtn = document.getElementById('endGameBtn');
        const gameOverScreen = document.getElementById('game-over');
        const finalWaveEl = document.getElementById('finalWave');
        const highScoreUIEl = document.getElementById('highScoreUI');
        const totalGoldEl = document.getElementById('totalGold');
        const runGoldEarnedEl = document.getElementById('runGoldEarned');
        const restartBtn = document.getElementById('restart');
        const prestigeResetBtn = document.getElementById('prestigeReset');
        const prestigeConfirmDiv = document.getElementById('prestigeConfirm');
        const prestigeInput = document.getElementById('prestigeInput');
        const confirmPrestigeBtn = document.getElementById('confirmPrestige');

        // === VARIÁVEIS ===
        let persistent = { 
            gold: 0, 
            damageLevel: 0, 
            fireRateLevel: 0, 
            healthLevel: 0, 
            rangeLevel: 0, 
            critChanceLevel: 0,
            regenLevel: 0,
            damageReductionLevel: 0,
            dodgeChanceLevel: 0,
            goldWaveLevel: 0,
            copperWaveLevel: 0,
            copperKillLevel: 0,
            goldKillChanceLevel: 0,
            goldKillAmountLevel: 0,
            startingGoldLevel: 0,
            highScore: 0, 
            color: '#0000FF',
            prestigeCount: 0
        };

        let copper = 0;
        let runStartGold = 0;
        let costs = { damage: 5, fireRate: 5, health: 5, range: 5 };

        const ZOOM = 0.5;
        const TOWER_SIZE = 50;
        let gameSpeed = 1.0;

        let tower = {
            size: TOWER_SIZE,
            health: 150,
            maxHealth: 150,
            damage: 15,
            fireRate: 800,
            range: 180,
            critChance: 0.05,
            regenPerSecond: 0,
            damageReduction: 0,
            dodgeChance: 0,
            color: '#0000FF',
            lastShot: 0,
            lastRegen: Date.now()
        };

        let enemies = [];
        let projectiles = [];
        let dodgeFlash = 0;
        let wave = 1;
        let enemiesThisWave = 0;
        let totalEnemiesForWave = 5;
        let gameOver = false;
        let gameOverTime = 0;
        let lastEnemySpawn = 0;
        let enemySpawnRate = 3000;
        let animationFrameId = null;
        let lastTime = 0;

        // === FUNÇÕES ===
        function resizeCanvas() {
            const maxW = window.innerWidth * 0.95;
            const maxH = window.innerHeight * 0.65;
            let targetW = Math.min(800, maxW);
            let targetH = targetW * (600 / 800);
            if (targetH > maxH) { targetH = maxH; targetW = targetH * (800 / 600); }
            canvas.width = targetW;
            canvas.height = targetH;
        }
        window.addEventListener('resize', resizeCanvas);

        function random(min, max) { return Math.random() * (max - min) + min; }
        function distance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

        function saveProgress() {
            localStorage.setItem('centergunSave', JSON.stringify(persistent));
        }

        function loadSave() {
            const save = JSON.parse(localStorage.getItem('centergunSave')) || {};
            Object.assign(persistent, save);
            tower.color = persistent.color || '#0000FF';
            colorPicker.value = tower.color;
            newRun();
            updateMetaLevels();
        }

        function newRun() {
            tower.damage = 15 + persistent.damageLevel * 2;
            tower.fireRate = Math.max(200, 800 - persistent.fireRateLevel * 50);
            tower.range = 180 + persistent.rangeLevel * 20;
            tower.maxHealth = 150 + persistent.healthLevel * 20;
            tower.health = tower.maxHealth;
            tower.critChance = 0.05 + persistent.critChanceLevel * 0.01;
            tower.regenPerSecond = persistent.regenLevel * 0.1;
            tower.damageReduction = persistent.damageReductionLevel * 1;
            tower.dodgeChance = persistent.dodgeChanceLevel * 0.005;
            tower.lastShot = 0;
            tower.lastRegen = Date.now();

            copper = 50 * persistent.startingGoldLevel;
            costs = { damage: 5, fireRate: 5, health: 5, range: 5 };
            wave = 1;
            enemies = [];
            projectiles = [];
            enemiesThisWave = 0;
            totalEnemiesForWave = 5;
            lastEnemySpawn = 0;
            enemySpawnRate = 3000;
            gameOver = false;
            gameOverTime = 0;
            dodgeFlash = 0;
            gameOverScreen.style.display = 'none';
            runStartGold = persistent.gold;

            updateUpgradeButtons();
            updateStatsUI();
            updateUI();
        }

        function updateStatsUI() {
            if (statDamage) statDamage.textContent = tower.damage;
            if (statFireRate) statFireRate.textContent = (1000 / tower.fireRate).toFixed(2);
            if (statRange) statRange.textContent = Math.round(tower.range);
            if (statMaxHealth) statMaxHealth.textContent = tower.maxHealth;
            if (statRegen) statRegen.textContent = tower.regenPerSecond.toFixed(1);
        }

        function updateUpgradeButtons() {
            // Pode atualizar textos de botões temporários aqui se quiser
        }

        function updateMetaLevels() {
            const levels = {
                lvDamage: persistent.damageLevel,
                lvFireRate: persistent.fireRateLevel,
                lvHealth: persistent.healthLevel,
                lvRange: persistent.rangeLevel,
                lvCritChance: persistent.critChanceLevel,
                lvRegen: persistent.regenLevel,
                lvDamageReduction: persistent.damageReductionLevel,
                lvDodgeChance: persistent.dodgeChanceLevel,
                lvGoldWave: persistent.goldWaveLevel,
                lvCopperWave: persistent.copperWaveLevel,
                lvCopperKill: persistent.copperKillLevel,
                lvGoldKillChance: persistent.goldKillChanceLevel,
                lvGoldKillAmount: persistent.goldKillAmountLevel,
                lvStartingGold: persistent.startingGoldLevel
            };
            for (const [id, value] of Object.entries(levels)) {
                const el = document.getElementById(id);
                if (el) el.textContent = value;
            }
        }

        function updateGameOverUI() {
            if (totalGoldEl) totalGoldEl.textContent = persistent.gold;
            if (runGoldEarnedEl) runGoldEarnedEl.textContent = persistent.gold - runStartGold;
            if (highScoreUIEl) highScoreUIEl.textContent = persistent.highScore;
            if (finalWaveEl) finalWaveEl.textContent = wave - 1;
            updateMetaLevels();
        }

        class Enemy {
            constructor(isBoss = false) {
                this.isBoss = isBoss;
                const angle = random(0, Math.PI * 2);
                const spawnDist = tower.range / ZOOM + (isBoss ? 400 : 200) + random(0, 300);
                this.x = canvas.width / 2 + Math.cos(angle) * spawnDist;
                this.y = canvas.height / 2 + Math.sin(angle) * spawnDist;
                this.radius = isBoss ? 30 : 10;
                const growthFactor = Math.pow(1.15, wave - 1);
                let baseHealth = 30 * growthFactor + random(0, 20);
                this.health = isBoss ? Math.floor(baseHealth * 4) : Math.floor(baseHealth);
                this.maxHealth = this.health;
                this.damage = Math.floor(15 * Math.pow(1.12, wave - 1)) * (isBoss ? 2 : 1);
                const speedGrowth = Math.pow(1.09, wave - 1);
                this.baseSpeed = (0.5 + 0.3 * speedGrowth + random(-0.1, 0.3)) * (isBoss ? 0.7 : 1);
                this.color = isBoss ? '#8B008B' : 'red';
            }
            update(delta) {
                const dx = canvas.width / 2 - this.x;
                const dy = canvas.height / 2 - this.y;
                const dist = Math.hypot(dx, dy);
                if (dist < tower.size / 2 + this.radius) {
                    let finalDamage = this.damage - tower.damageReduction;
                    if (finalDamage < 0) finalDamage = 0;
                    if (Math.random() < tower.dodgeChance) {
                        dodgeFlash = Date.now();
                        finalDamage = 0;
                    }
                    tower.health = Math.max(0, tower.health - finalDamage);
                    this.x = canvas.width + 100;
                } else {
                    const speed = this.baseSpeed * gameSpeed;
                    this.x += (dx / dist) * speed * delta;
                    this.y += (dy / dist) * speed * delta;
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#444';
                ctx.fillRect(this.x - this.radius, this.y - this.radius - 20, this.radius * 2, 5);
                if (this.health > 0) {
                    ctx.fillStyle = this.health > this.maxHealth * 0.5 ? '#4CAF50' : '#f44336';
                    ctx.fillRect(this.x - this.radius, this.y - this.radius - 20, (this.health / this.maxHealth) * (this.radius * 2), 5);
                }
            }
        }

        class Projectile {
            constructor(target) {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.radius = 8;
                this.speed = 7;
                const dx = target.x - this.x;
                const dy = target.y - this.y;
                const dist = Math.hypot(dx, dy) || 1;
                this.vx = (dx / dist) * this.speed;
                this.vy = (dy / dist) * this.speed;
            }
            update(delta) {
                this.x += this.vx * gameSpeed * delta;
                this.y += this.vy * gameSpeed * delta;
            }
            draw() {
                ctx.fillStyle = 'yellow';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#ff0'; ctx.lineWidth = 2; ctx.stroke();
            }
        }

        function spawnEnemy() {
            if (enemiesThisWave < totalEnemiesForWave && Date.now() - lastEnemySpawn > enemySpawnRate) {
                const isBoss = (wave % 10 === 0 && wave >= 10 && enemiesThisWave === 0);
                enemies.push(new Enemy(isBoss));
                enemiesThisWave++;
                lastEnemySpawn = Date.now();
            }
        }

        function shoot() {
            if (Date.now() - tower.lastShot > (tower.fireRate / gameSpeed) && enemies.length > 0) {
                let closest = null;
                let minDist = Infinity;
                enemies.forEach(enemy => {
                    if (enemy.health <= 0) return;
                    const dist = distance(canvas.width / 2, canvas.height / 2, enemy.x, enemy.y);
                    if (dist < minDist && dist <= tower.range) {
                        minDist = dist;
                        closest = enemy;
                    }
                });
                if (closest) {
                    projectiles.push(new Projectile(closest));
                    tower.lastShot = Date.now();
                }
            }
        }

        function updateUI() {
            if (waveElement) waveElement.textContent = `Onda: ${wave}`;
            if (statCopper) statCopper.textContent = Math.floor(copper);
            if (statGold) statGold.textContent = persistent.gold;
            if (healthBar) healthBar.style.width = `${Math.max(0, (tower.health / tower.maxHealth) * 100)}%`;
            updateStatsUI();
        }

        function checkGameOver() {
            if (tower.health <= 0 && !gameOver) {
                persistent.highScore = Math.max(persistent.highScore, wave - 1);
                updateGameOverUI();
                gameOverScreen.style.display = 'block';
                saveProgress();
                gameOver = true;
                gameOverTime = Date.now();
            }
        }

        function nextWave() {
            if (enemies.length === 0 && enemiesThisWave >= totalEnemiesForWave && !gameOver) {
                wave++;
                totalEnemiesForWave += 3;
                enemiesThisWave = 0;
                enemySpawnRate = Math.max(800, enemySpawnRate - 100 * gameSpeed);
                copper += wave * 5;
                persistent.gold += Math.floor(wave / 3) + 1;
                saveProgress();
            }
        }

        // Botões
        endGameBtn.addEventListener('click', () => {
            if (!gameOver) {
                gameOver = true;
                gameOverTime = Date.now();
                gameOverScreen.style.display = 'block';
                updateGameOverUI();
                saveProgress();
            }
        });

        speedToggle.addEventListener('click', () => {
            gameSpeed = gameSpeed === 1 ? 2 : 1;
            speedToggle.textContent = `2x (${gameSpeed === 2 ? 'ON' : 'OFF'})`;
            speedToggle.classList.toggle('active', gameSpeed === 2);
        });

        colorPicker.addEventListener('input', () => {
            tower.color = persistent.color = colorPicker.value;
            saveProgress();
        });

        // Abas
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
            });
        });

        // Meta upgrades permanentes
        const metaButtons = [
            { id: 'metaDamage', prop: 'damageLevel', cost: 20 },
            { id: 'metaFireRate', prop: 'fireRateLevel', cost: 30 },
            { id: 'metaHealth', prop: 'healthLevel', cost: 50 },
            { id: 'metaRange', prop: 'rangeLevel', cost: 40 },
            { id: 'metaCritChance', prop: 'critChanceLevel', cost: 50 },
            { id: 'metaRegen', prop: 'regenLevel', cost: 60 },
            { id: 'metaDamageReduction', prop: 'damageReductionLevel', cost: 70 },
            { id: 'metaDodgeChance', prop: 'dodgeChanceLevel', cost: 80 },
            { id: 'metaGoldWave', prop: 'goldWaveLevel', cost: 50 },
            { id: 'metaCopperWave', prop: 'copperWaveLevel', cost: 40 },
            { id: 'metaCopperKill', prop: 'copperKillLevel', cost: 45 },
            { id: 'metaGoldKillChance', prop: 'goldKillChanceLevel', cost: 60 },
            { id: 'metaGoldKillAmount', prop: 'goldKillAmountLevel', cost: 100 },
            { id: 'metaStartingGold', prop: 'startingGoldLevel', cost: 150 }
        ];

        metaButtons.forEach(({ id, prop, cost }) => {
            const btn = document.getElementById(id);
            if (btn) {
                btn.addEventListener('click', () => {
                    if (persistent.gold >= cost) {
                        persistent.gold -= cost;
                        persistent[prop] += 1;
                        updateGameOverUI();
                        saveProgress();
                        updateMetaLevels();
                    }
                });
            }
        });

        // Upgrades temporários
        const tempButtons = [
            { id: 'upgradeDamageTemp', action: () => { if (copper >= costs.damage) { copper -= costs.damage; tower.damage += 2; costs.damage = Math.floor(costs.damage * 1.6) + 3; } } },
            { id: 'upgradeFireRateTemp', action: () => { if (copper >= costs.fireRate) { copper -= costs.fireRate; tower.fireRate = Math.max(200, tower.fireRate - 50); costs.fireRate = Math.floor(costs.fireRate * 1.6) + 3; } } },
            { id: 'upgradeHealthTemp', action: () => { if (copper >= costs.health) { copper -= costs.health; tower.maxHealth += 10; tower.health += 10; costs.health = Math.floor(costs.health * 1.6) + 3; } } },
            { id: 'upgradeRangeTemp', action: () => { if (copper >= costs.range) { copper -= costs.range; tower.range += 25; costs.range = Math.floor(costs.range * 1.6) + 3; } } }
        ];

        tempButtons.forEach(({ id, action }) => {
            const btn = document.getElementById(id);
            if (btn) btn.addEventListener('click', action);
        });

        // Prestígio
        prestigeResetBtn.addEventListener('click', () => {
            if ((wave - 1) < 50 || persistent.gold < 1000) {
                alert(`Requisitos não atendidos! ≥ 50 ondas e ≥ 1000 ouro.`);
                return;
            }
            prestigeConfirmDiv.style.display = 'block';
        });

        confirmPrestigeBtn.addEventListener('click', () => {
            if (prestigeInput.value.trim() === 'gswolf101') {
                Object.keys(persistent).forEach(key => {
                    if (key.endsWith('Level')) persistent[key] = 0;
                });
                persistent.prestigeCount = (persistent.prestigeCount || 0) + 1;
                prestigeConfirmDiv.style.display = 'none';
                prestigeInput.value = '';
                updateGameOverUI();
                saveProgress();
                alert(`Prestígio realizado! Multiplicador: ${(1 + persistent.prestigeCount * 0.1).toFixed(2)}×`);
            } else {
                alert('Código incorreto!');
            }
        });

        restartBtn.addEventListener('click', () => {
            newRun();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            lastTime = 0;
            animationFrameId = requestAnimationFrame(gameLoop);
        });

        // Inicialização final
        resizeCanvas();
        loadSave();
        animationFrameId = requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
