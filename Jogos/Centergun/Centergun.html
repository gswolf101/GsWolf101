<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centergun</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            margin-top: 20px;
        }
        canvas {
            background-color: #333;
            border: 2px solid #fff;
            display: block;
        }
        #ui {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 800px;
            margin: 10px 0;
            font-size: 18px;
        }
        #health-bar-container {
            width: 200px;
            height: 20px;
            background: #555;
            border: 1px solid #fff;
            position: relative;
            margin-top: 5px;
        }
        #health-bar {
            height: 100%;
            background: #4CAF50;
            width: 100%;
            transition: width 0.3s;
        }
        #upgrades {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin: 10px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }
        button:hover, button:active {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        #color-picker {
            margin: 5px;
            padding: 5px;
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            text-align: center;
            display: none;
            z-index: 10;
            border-radius: 10px;
            max-width: 90%;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        #meta-upgrades {
            margin: 20px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            max-width: 400px;
            margin: 20px auto;
        }
        @media (max-width: 600px) {
            #ui {
                flex-direction: column;
                align-items: center;
                font-size: 16px;
            }
            #upgrades {
                flex-direction: column;
                align-items: center;
            }
            #meta-upgrades {
                grid-template-columns: 1fr;
            }
            canvas {
                width: 100vw;
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p>Ondas Sobrevividas: <span id="finalWave">0</span></p>
            <p>Recorde: <span id="highScoreUI">0</span></p>
            <p>Ouro Total: <span id="totalGold">0</span> | Ganho nesta run: <span id="runGoldEarned">0</span></p>
            <h3>Upgrades Permanentes (com Ouro)</h3>
            <div id="meta-upgrades">
                <button id="metaDamage">Dano +1 (20 Ouro) Lv.0</button>
                <button id="metaFireRate">Taxa de Fogo +1 (30 Ouro) Lv.0</button>
                <button id="metaHealth">Vida Máx +1 (50 Ouro) Lv.0</button>
                <button id="metaRange">Alcance +1 (40 Ouro) Lv.0</button>
            </div>
            <button id="restart">Iniciar Nova Partida</button>
        </div>
    </div>
    <div id="ui">
        <div id="wave">Onda: 1</div>
        <div id="copper">Cobre: 0</div>
        <div id="goldUI">Ouro: 0</div>
        <div>
            Vida da Torre:
            <div id="health-bar-container">
                <div id="health-bar"></div>
            </div>
        </div>
    </div>
    <div id="upgrades">
        <button id="upgradeDamage">Upgrade Dano (+5) (Custo: 50 Cobre)</button>
        <button id="upgradeFireRate">Upgrade Taxa de Fogo (Custo: 75 Cobre)</button>
        <button id="upgradeHealth">Upgrade Vida (+20) (Custo: 100 Cobre)</button>
        <button id="upgradeRange">Upgrade Alcance (+50) (Custo: 100 Cobre)</button>
        <label>Cor da Torre: <input type="color" id="color-picker" value="#0000FF"></label>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const waveElement = document.getElementById('wave');
        const copperElement = document.getElementById('copper');
        const goldElement = document.getElementById('goldUI');
        const healthBar = document.getElementById('health-bar');
        const upgradeDamageBtn = document.getElementById('upgradeDamage');
        const upgradeFireRateBtn = document.getElementById('upgradeFireRate');
        const upgradeHealthBtn = document.getElementById('upgradeHealth');
        const upgradeRangeBtn = document.getElementById('upgradeRange');
        const colorPicker = document.getElementById('color-picker');
        const gameOverScreen = document.getElementById('game-over');
        const finalWaveEl = document.getElementById('finalWave');
        const highScoreUIEl = document.getElementById('highScoreUI');
        const totalGoldEl = document.getElementById('totalGold');
        const runGoldEarnedEl = document.getElementById('runGoldEarned');
        const restartBtn = document.getElementById('restart');

        // Persistent e run vars
        let persistent = {
            gold: 0,
            damageLevel: 0,
            fireRateLevel: 0,
            healthLevel: 0,
            rangeLevel: 0,
            highScore: 0,
            color: '#0000FF'
        };
        let copper = 0;
        let runStartGold = 0;

        let tower = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 50,
            health: 150, // Aumentei vida inicial pra facilitar o começo
            maxHealth: 150,
            damage: 15,  // Dano inicial maior
            fireRate: 800, // Tiro mais rápido
            range: 250,   // Alcance maior
            color: '#0000FF',
            lastShot: 0
        };

        let enemies = [];
        let projectiles = [];
        let wave = 1;
        let gameOver = false;
        let lastEnemySpawn = 0;
        let enemySpawnRate = 3000; // Spawn mais lento no início

        // Funções auxiliares
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        function distance(x1, y1, x2, y2) {
            return Math.hypot(x2 - x1, y2 - y1);
        }

        function saveProgress() {
            const save = { ...persistent };
            localStorage.setItem('centergunSave', JSON.stringify(save));
        }

        function loadSave() {
            const save = JSON.parse(localStorage.getItem('centergunSave')) || {};
            persistent = {
                gold: save.gold || 0,
                damageLevel: save.damageLevel || 0,
                fireRateLevel: save.fireRateLevel || 0,
                healthLevel: save.healthLevel || 0,
                rangeLevel: save.rangeLevel || 0,
                highScore: save.highScore || 0,
                color: save.color || '#0000FF'
            };
            tower.color = persistent.color;
            colorPicker.value = tower.color;
            newRun();
        }

        function newRun() {
            tower.damage = 15 + persistent.damageLevel * 2;
            tower.fireRate = Math.max(200, 800 - persistent.fireRateLevel * 50);
            tower.range = 250 + persistent.rangeLevel * 20;
            tower.maxHealth = 150 + persistent.healthLevel * 20;
            tower.health = tower.maxHealth;
            copper = 0;
            wave = 1;
            enemies = [];
            projectiles = [];
            lastEnemySpawn = 0;
            enemySpawnRate = 3000;
            gameOver = false;
            gameOverScreen.style.display = 'none';
            runStartGold = persistent.gold;
        }

        function updateMetaUI() {
            document.getElementById('metaDamage').textContent = `Dano +1 (20 Ouro) Lv.${persistent.damageLevel}`;
            document.getElementById('metaFireRate').textContent = `Taxa de Fogo +1 (30 Ouro) Lv.${persistent.fireRateLevel}`;
            document.getElementById('metaHealth').textContent = `Vida Máx +1 (50 Ouro) Lv.${persistent.healthLevel}`;
            document.getElementById('metaRange').textContent = `Alcance +1 (40 Ouro) Lv.${persistent.rangeLevel}`;
        }

        function updateGameOverUI() {
            totalGoldEl.textContent = persistent.gold;
            runGoldEarnedEl.textContent = persistent.gold - runStartGold;
            highScoreUIEl.textContent = persistent.highScore;
            finalWaveEl.textContent = wave - 1;
            updateMetaUI();
        }

        // Enemy
        class Enemy {
            constructor() {
                const angle = random(0, Math.PI * 2);
                const spawnDist = tower.range + 50 + random(0, 100);
                this.x = tower.x + Math.cos(angle) * spawnDist;
                this.y = tower.y + Math.sin(angle) * spawnDist;
                this.x = Math.max(20, Math.min(canvas.width - 20, this.x));
                this.y = Math.max(20, Math.min(canvas.height - 20, this.y));
                this.width = 20;
                this.height = 20;
                this.speed = 0.6 + wave * 0.1 + random(0, 0.4); // Mais lento
                this.health = Math.floor(20 + wave * 4 + random(0, 8)); // Menos vida
                this.maxHealth = this.health;
            }
            update() {
                const dx = tower.x - this.x;
                const dy = tower.y - this.y;
                const dist = Math.hypot(dx, dy);
                if (dist < tower.size / 2 + this.width / 2) {
                    tower.health = Math.max(0, tower.health - (10 + wave * 2));
                    this.x = canvas.width + 100;
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
            }
            draw() {
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.width / 2, 0, Math.PI * 2);
                ctx.fill();

                // Barra de vida
                ctx.fillStyle = '#444';
                ctx.fillRect(this.x - 12, this.y - 28, 24, 5);
                if (this.health > 0) {
                    ctx.fillStyle = this.health > this.maxHealth * 0.5 ? '#4CAF50' : '#f44336';
                    ctx.fillRect(this.x - 12, this.y - 28, (this.health / this.maxHealth) * 24, 5);
                }
            }
        }

        // Projétil (agora círculo!)
        class Projectile {
            constructor(target) {
                this.x = tower.x;
                this.y = tower.y;
                this.radius = 10; // Tamanho do círculo
                this.speed = 7;
                this.target = target;
            }
            update() {
                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;
                const dist = Math.hypot(dx, dy);
                if (dist < this.speed + this.target.width / 2 + this.radius) {
                    this.target.health -= tower.damage;
                    if (this.target.health <= 0) {
                        copper += 10 + wave * 2;
                        if (Math.random() < 0.02) { // 2% chance de ouro por kill
                            persistent.gold += 1;
                        }
                        this.target.x = canvas.width + 100;
                    }
                    this.x = -100;
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
            }
            draw() {
                ctx.fillStyle = 'yellow';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#ff0';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Spawn
        function spawnEnemy() {
            if (Date.now() - lastEnemySpawn > enemySpawnRate) {
                enemies.push(new Enemy());
                lastEnemySpawn = Date.now();
            }
        }

        // Shoot
        function shoot() {
            if (Date.now() - tower.lastShot > tower.fireRate && enemies.length > 0) {
                let closest = null;
                let minDist = Infinity;
                enemies.forEach(enemy => {
                    const dist = distance(tower.x, tower.y, enemy.x, enemy.y);
                    if (dist < minDist && dist <= tower.range && enemy.health > 0) {
                        minDist = dist;
                        closest = enemy;
                    }
                });
                if (closest) {
                    projectiles.push(new Projectile(closest));
                    tower.lastShot = Date.now();
                }
            }
        }

        // Update UI
        function updateUI() {
            waveElement.textContent = `Onda: ${wave}`;
            copperElement.textContent = `Cobre: ${copper}`;
            goldElement.textContent = `Ouro: ${persistent.gold}`;
            healthBar.style.width = `${(tower.health / tower.maxHealth) * 100}%`;
        }

        // Game over
        function checkGameOver() {
            if (tower.health <= 0) {
                persistent.highScore = Math.max(persistent.highScore, wave - 1);
                updateGameOverUI();
                gameOverScreen.style.display = 'block';
                saveProgress();
                gameOver = true;
            }
        }

        // Next wave
        function nextWave() {
            if (enemies.length === 0 && Date.now() - lastEnemySpawn > 1000) {
                wave++;
                enemySpawnRate = Math.max(600, 3000 - (wave - 1) * 120);
                copper += wave * 20;
                persistent.gold += Math.floor(wave / 3) + 1; // Mais ouro por onda
                saveProgress();
            }
        }

        // Upgrades da run (cobre)
        upgradeDamageBtn.addEventListener('click', () => {
            if (copper >= 50) {
                copper -= 50;
                tower.damage += 5;
            }
        });
        upgradeFireRateBtn.addEventListener('click', () => {
            if (copper >= 75) {
                copper -= 75;
                tower.fireRate = Math.max(200, tower.fireRate - 100);
            }
        });
        upgradeHealthBtn.addEventListener('click', () => {
            if (copper >= 100) {
                copper -= 100;
                tower.maxHealth += 20;
                tower.health += 20;
            }
        });
        upgradeRangeBtn.addEventListener('click', () => {
            if (copper >= 100) {
                copper -= 100;
                tower.range += 50;
            }
        });

        // Cor
        colorPicker.addEventListener('input', () => {
            tower.color = persistent.color = colorPicker.value;
            saveProgress();
        });

        // Meta upgrades
        document.getElementById('metaDamage').addEventListener('click', () => {
            if (persistent.gold >= 20) {
                persistent.gold -= 20;
                persistent.damageLevel += 1;
                updateGameOverUI();
                saveProgress();
            }
        });
        document.getElementById('metaFireRate').addEventListener('click', () => {
            if (persistent.gold >= 30) {
                persistent.gold -= 30;
                persistent.fireRateLevel += 1;
                updateGameOverUI();
                saveProgress();
            }
        });
        document.getElementById('metaHealth').addEventListener('click', () => {
            if (persistent.gold >= 50) {
                persistent.gold -= 50;
                persistent.healthLevel += 1;
                updateGameOverUI();
                saveProgress();
            }
        });
        document.getElementById('metaRange').addEventListener('click', () => {
            if (persistent.gold >= 40) {
                persistent.gold -= 40;
                persistent.rangeLevel += 1;
                updateGameOverUI();
                saveProgress();
            }
        });

        // Restart
        restartBtn.addEventListener('click', newRun);

        // Game Loop
        function gameLoop() {
            if (gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Torre
            ctx.fillStyle = tower.color;
            ctx.beginPath();
            ctx.arc(tower.x, tower.y, tower.size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Círculo de alcance
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(tower.x, tower.y, tower.range, 0, Math.PI * 2);
            ctx.stroke();

            // Onda no topo
            ctx.font = 'bold 40px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.fillText(`Onda ${wave}`, canvas.width / 2, 50);

            spawnEnemy();
            shoot();

            // Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update();
                enemies[i].draw();
                if (enemies[i].x > canvas.width + 50 || enemies[i].health <= 0) {
                    enemies.splice(i, 1);
                }
            }

            // Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) {
                projectiles[i].update();
                projectiles[i].draw();
                if (projectiles[i].x < -50 || projectiles[i].x > canvas.width + 50) {
                    projectiles.splice(i, 1);
                }
            }

            updateUI();
            checkGameOver();
            nextWave();

            requestAnimationFrame(gameLoop);
        }

        // Init
        loadSave();
        gameLoop();
    </script>
</body>
</html>
