<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centergun</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; margin: 0; background-color: #222; color: #fff; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
        #game-container { position: relative; margin-top: 10px; flex: 1; display: flex; justify-content: center; align-items: center; }
        canvas { background-color: #333; border: 2px solid #fff; display: block; max-width: 100%; max-height: 65vh; }
        #ui { display: flex; justify-content: space-between; width: 100%; max-width: 800px; margin: 5px 0; font-size: 16px; }
        #stats { background: rgba(0,0,0,0.5); padding: 8px; border-radius: 5px; line-height: 1.6; }
        #health-bar-container { width: 200px; height: 20px; background: #555; border: 1px solid #fff; position: relative; margin-top: 5px; }
        #health-bar { height: 100%; background: #4CAF50; width: 100%; transition: width 0.3s; }
        #upgrades { display: flex; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 800px; margin: 5px 0; }
        button { background: #4CAF50; color: white; border: none; padding: 8px 12px; margin: 5px; cursor: pointer; border-radius: 5px; font-size: 14px; }
        button:hover { background: #45a049; }
        button:disabled { background: #666; cursor: not-allowed; }
        button.active { background: #ff4444; }
        #color-picker { margin: 5px; padding: 5px; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 30px; text-align: center; display: none; z-index: 10; border-radius: 10px; max-width: 90%; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
        #meta-tabs { margin: 10px 0; text-align: center; }
        .tab-button { background: #555; color: white; border: none; padding: 10px 20px; margin: 0 5px; cursor: pointer; border-radius: 5px 5px 0 0; }
        .tab-button.active { background: #4CAF50; }
        .tab-content { display: none; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 0 5px 5px 5px; max-width: 600px; margin: 0 auto; }
        .tab-content.active { display: block; }
        #meta-upgrades { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
        .icon { margin-right: 5px; font-size: 1.1em; }
        input[type="text"] { padding: 8px; margin: 10px; width: 200px; }
        @media (max-width: 600px) { #ui { flex-direction: column; align-items: center; font-size: 14px; } #upgrades { flex-direction: column; align-items: center; } #meta-upgrades { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p>Ondas Sobrevividas: <span id="finalWave">0</span></p>
            <p>Recorde: <span id="highScoreUI">0</span></p>
            <p>Ouro Total: <span id="totalGold">0</span> | Ganho nesta run: <span id="runGoldEarned">0</span></p>
            <h3>Upgrades Permanentes (com Ouro)</h3>
            <div id="meta-tabs">
                <button class="tab-button active" data-tab="attack">Ataque</button>
                <button class="tab-button" data-tab="vida">Vida</button>
                <button class="tab-button" data-tab="defesa">Defesa</button>
                <button class="tab-button" data-tab="ganhos">Ganhos</button>
            </div>
            <div id="meta-upgrades">
                <!-- Ataque -->
                <div class="tab-content active" id="tab-attack">
                    <button id="metaDamage">Dano +1 (20 Ouro) Lv.<span id="lvDamage">0</span></button>
                    <button id="metaAttackSpeed">Velocidade Ataque +1 (30 Ouro) Lv.<span id="lvAttackSpeed">0</span></button>
                    <button id="metaRange">Alcance +1 (40 Ouro) Lv.<span id="lvRange">0</span></button>
                    <button id="metaCritChance">Chance Crítico +1% (50 Ouro) Lv.<span id="lvCritChance">0</span></button>
                </div>
                <!-- Vida -->
                <div class="tab-content" id="tab-vida">
                    <button id="metaHealth">Vida Máx +1 (50 Ouro) Lv.<span id="lvHealth">0</span></button>
                    <button id="metaRegen">Regeneração +0.1/s (60 Ouro) Lv.<span id="lvRegen">0</span></button>
                </div>
                <!-- Defesa -->
                <div class="tab-content" id="tab-defesa">
                    <button id="metaDamageReduction">Dano Reduzido +1 (70 Ouro) Lv.<span id="lvDamageReduction">0</span></button>
                    <button id="metaDodgeChance">Chance Esquiva +0.5% (80 Ouro) Lv.<span id="lvDodgeChance">0</span></button>
                </div>
                <!-- Ganhos -->
                <div class="tab-content" id="tab-ganhos">
                    <button id="metaGoldWave">Ouro por onda +1 (50 Ouro) Lv.<span id="lvGoldWave">0</span></button>
                    <button id="metaCopperWave">Cobre por onda +5 (40 Ouro) Lv.<span id="lvCopperWave">0</span></button>
                    <button id="metaCopperKill">Cobre por eliminação +1 (45 Ouro) Lv.<span id="lvCopperKill">0</span></button>
                    <button id="metaGoldKillChance">Chance ouro por kill +0.5% (60 Ouro) Lv.<span id="lvGoldKillChance">0</span></button>
                    <button id="metaGoldKillAmount">Ouro por eliminação +1 (100 Ouro) Lv.<span id="lvGoldKillAmount">0</span></button>
                    <button id="metaStartingGold">Dinheiro inicial +50 (150 Ouro) Lv.<span id="lvStartingGold">0</span></button>
                </div>
            </div>
            <button id="prestigeReset">Resetar Atributos (Prestígio)</button>
            <div id="prestigeConfirm" style="display:none; margin-top:15px;">
                Digite 'gswolf101' para confirmar:<br>
                <input type="text" id="prestigeInput">
                <button id="confirmPrestige">Confirmar</button>
            </div>
            <button id="restart">Iniciar Nova Partida</button>
        </div>
    </div>

    <div id="ui">
        <div id="wave">Onda: 1</div>
        <div id="stats">
            <span class="icon">🪙</span> Cobre: <span id="statCopper">0</span> | 
            <span class="icon">🥇</span> Ouro: <span id="statGold">0</span><br>
            <span class="icon">⚔️</span> Dano: <span id="statDamage">15</span> | 
            <span class="icon">⚡</span> Taxa: <span id="statFireRate">1.25</span>/s | 
            <span class="icon">🎯</span> Alcance: <span id="statRange">180</span> | 
            <span class="icon">❤️</span> Vida Máx: <span id="statMaxHealth">150</span> | 
            <span class="icon">🛡️</span> Regen: <span id="statRegen">0</span>/s
        </div>
        <div>
            Vida da Torre:
            <div id="health-bar-container"><div id="health-bar"></div></div>
        </div>
    </div>

    <div id="upgrades">
        <button id="speedToggle">2x Speed (OFF)</button>
        <button id="upgradeDamage">Upgrade Dano (+2) (Custo: 5 Cobre)</button>
        <button id="upgradeFireRate">Upgrade Taxa de Fogo (Custo: 5 Cobre)</button>
        <button id="upgradeHealth">Upgrade Vida (+10) (Custo: 5 Cobre)</button>
        <button id="upgradeRange">Upgrade Alcance (+25) (Custo: 5 Cobre)</button>
        <label>Cor da Torre: <input type="color" id="color-picker" value="#0000FF"></label>
    </div>

    <script>
        // Declarações no topo
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const waveElement = document.getElementById('wave');
        const statCopper = document.getElementById('statCopper');
        const statGold = document.getElementById('statGold');
        const statDamage = document.getElementById('statDamage');
        const statFireRate = document.getElementById('statFireRate');
        const statRange = document.getElementById('statRange');
        const statMaxHealth = document.getElementById('statMaxHealth');
        const statRegen = document.getElementById('statRegen');
        const healthBar = document.getElementById('health-bar');
        const speedToggle = document.getElementById('speedToggle');
        const upgradeDamageBtn = document.getElementById('upgradeDamage');
        const upgradeFireRateBtn = document.getElementById('upgradeFireRate');
        const upgradeHealthBtn = document.getElementById('upgradeHealth');
        const upgradeRangeBtn = document.getElementById('upgradeRange');
        const colorPicker = document.getElementById('color-picker');
        const gameOverScreen = document.getElementById('game-over');
        const finalWaveEl = document.getElementById('finalWave');
        const highScoreUIEl = document.getElementById('highScoreUI');
        const totalGoldEl = document.getElementById('totalGold');
        const runGoldEarnedEl = document.getElementById('runGoldEarned');
        const restartBtn = document.getElementById('restart');
        const prestigeResetBtn = document.getElementById('prestigeReset');
        const prestigeConfirmDiv = document.getElementById('prestigeConfirm');
        const prestigeInput = document.getElementById('prestigeInput');
        const confirmPrestigeBtn = document.getElementById('confirmPrestige');

        // Variáveis de meta-progressão
        let persistent = { 
            gold: 0, 
            damageLevel: 0, 
            fireRateLevel: 0, 
            healthLevel: 0, 
            rangeLevel: 0, 
            critChanceLevel: 0,
            regenLevel: 0,
            damageReductionLevel: 0,
            dodgeChanceLevel: 0,
            goldWaveLevel: 0,
            copperWaveLevel: 0,
            copperKillLevel: 0,
            goldKillChanceLevel: 0,
            goldKillAmountLevel: 0,
            startingGoldLevel: 0,
            highScore: 0, 
            color: '#0000FF',
            prestigeCount: 0
        };

        let copper = 0;
        let runStartGold = 0;
        let costs = { damage: 5, fireRate: 5, health: 5, range: 5 };

        const ZOOM = 0.5;
        const TOWER_SIZE = 50;
        let gameSpeed = 1.0;

        let tower = {
            size: TOWER_SIZE,
            health: 150,
            maxHealth: 150,
            damage: 15,
            fireRate: 800,
            range: 180,
            critChance: 0.05, // 5% base
            regenPerSecond: 0,
            damageReduction: 0,
            dodgeChance: 0,
            color: '#0000FF',
            lastShot: 0,
            lastRegen: Date.now()
        };

        let enemies = [];
        let projectiles = [];
        let dodgeFlash = 0; // para efeito visual de esquiva
        let wave = 1;
        let enemiesThisWave = 0;
        let totalEnemiesForWave = 5;
        let gameOver = false;
        let gameOverTime = 0;
        let lastEnemySpawn = 0;
        let enemySpawnRate = 3000;
        let animationFrameId = null;
        let lastTime = 0;

        function resizeCanvas() {
            const maxW = window.innerWidth * 0.95;
            const maxH = window.innerHeight * 0.65;
            let targetW = Math.min(800, maxW);
            let targetH = targetW * (600 / 800);
            if (targetH > maxH) { targetH = maxH; targetW = targetH * (800 / 600); }
            canvas.width = targetW;
            canvas.height = targetH;
        }
        window.addEventListener('resize', resizeCanvas);

        function random(min, max) { return Math.random() * (max - min) + min; }
        function distance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

        function saveProgress() {
            localStorage.setItem('centergunSave', JSON.stringify(persistent));
        }

        function loadSave() {
            const save = JSON.parse(localStorage.getItem('centergunSave')) || {};
            Object.assign(persistent, save);
            tower.color = persistent.color || '#0000FF';
            colorPicker.value = tower.color;
            newRun();
            updateMetaLevels();
        }

        function newRun() {
            const prestigeBonus = 1 + (persistent.prestigeCount * 0.1);
            tower.damage = 15 + persistent.damageLevel * 2;
            tower.fireRate = Math.max(200, 800 - persistent.fireRateLevel * 50);
            tower.range = 180 + persistent.rangeLevel * 20;
            tower.maxHealth = 150 + persistent.healthLevel * 20;
            tower.health = tower.maxHealth;
            tower.critChance = 0.05 + persistent.critChanceLevel * 0.01;
            tower.regenPerSecond = persistent.regenLevel * 0.1;
            tower.damageReduction = persistent.damageReductionLevel * 1;
            tower.dodgeChance = persistent.dodgeChanceLevel * 0.005;
            tower.lastShot = 0;
            tower.lastRegen = Date.now();

            copper = 50 * persistent.startingGoldLevel; // Dinheiro inicial
            costs = { damage: 5, fireRate: 5, health: 5, range: 5 };
            wave = 1;
            enemies = [];
            projectiles = [];
            enemiesThisWave = 0;
            totalEnemiesForWave = 5;
            lastEnemySpawn = 0;
            enemySpawnRate = 3000;
            gameOver = false;
            gameOverTime = 0;
            dodgeFlash = 0;
            gameOverScreen.style.display = 'none';
            runStartGold = persistent.gold;

            updateUpgradeButtons();
            updateStatsUI();
            updateUI();
        }

        function updateStatsUI() {
            statDamage.textContent = tower.damage;
            statFireRate.textContent = (1000 / tower.fireRate).toFixed(2);
            statRange.textContent = Math.round(tower.range);
            statMaxHealth.textContent = tower.maxHealth;
            statRegen.textContent = tower.regenPerSecond.toFixed(1);
        }

        function updateUpgradeButtons() {
            upgradeDamageBtn.textContent = `Upgrade Dano (+2) (Custo: ${costs.damage} Cobre)`;
            upgradeFireRateBtn.textContent = `Upgrade Taxa de Fogo (Custo: ${costs.fireRate} Cobre)`;
            upgradeHealthBtn.textContent = `Upgrade Vida (+10) (Custo: ${costs.health} Cobre)`;
            upgradeRangeBtn.textContent = `Upgrade Alcance (+25) (Custo: ${costs.range} Cobre)`;
        }

        function updateMetaLevels() {
            document.getElementById('lvDamage').textContent = persistent.damageLevel;
            document.getElementById('lvFireRate').textContent = persistent.fireRateLevel;
            document.getElementById('lvHealth').textContent = persistent.healthLevel;
            document.getElementById('lvRange').textContent = persistent.rangeLevel;
            document.getElementById('lvCritChance').textContent = persistent.critChanceLevel;
            document.getElementById('lvRegen').textContent = persistent.regenLevel;
            document.getElementById('lvDamageReduction').textContent = persistent.damageReductionLevel;
            document.getElementById('lvDodgeChance').textContent = persistent.dodgeChanceLevel;
            document.getElementById('lvGoldWave').textContent = persistent.goldWaveLevel;
            document.getElementById('lvCopperWave').textContent = persistent.copperWaveLevel;
            document.getElementById('lvCopperKill').textContent = persistent.copperKillLevel;
            document.getElementById('lvGoldKillChance').textContent = persistent.goldKillChanceLevel;
            document.getElementById('lvGoldKillAmount').textContent = persistent.goldKillAmountLevel;
            document.getElementById('lvStartingGold').textContent = persistent.startingGoldLevel;
        }

        function updateGameOverUI() {
            totalGoldEl.textContent = persistent.gold;
            runGoldEarnedEl.textContent = persistent.gold - runStartGold;
            highScoreUIEl.textContent = persistent.highScore;
            finalWaveEl.textContent = wave - 1;
            updateMetaLevels();
        }

        class Enemy {
            constructor(isBoss = false) {
                this.isBoss = isBoss;
                const angle = random(0, Math.PI * 2);
                const spawnDist = tower.range / ZOOM + (isBoss ? 400 : 200) + random(0, 300);
                this.x = canvas.width / 2 + Math.cos(angle) * spawnDist;
                this.y = canvas.height / 2 + Math.sin(angle) * spawnDist;
                this.radius = isBoss ? 30 : 10;
                const growthFactor = Math.pow(1.15, wave - 1);
                let baseHealth = 30 * growthFactor + random(0, 20);
                this.health = isBoss ? Math.floor(baseHealth * 4) : Math.floor(baseHealth);
                this.maxHealth = this.health;
                this.damage = Math.floor(15 * Math.pow(1.12, wave - 1)) * (isBoss ? 2 : 1);
                const speedGrowth = Math.pow(1.09, wave - 1);
                this.baseSpeed = (0.5 + 0.3 * speedGrowth + random(-0.1, 0.3)) * (isBoss ? 0.7 : 1);
                this.color = isBoss ? '#8B008B' : 'red';
            }
            update(delta) {
                const dx = canvas.width / 2 - this.x;
                const dy = canvas.height / 2 - this.y;
                const dist = Math.hypot(dx, dy);
                if (dist < tower.size / 2 + this.radius) {
                    let finalDamage = this.damage - tower.damageReduction;
                    if (finalDamage < 0) finalDamage = 0;
                    if (Math.random() < tower.dodgeChance) {
                        dodgeFlash = Date.now(); // efeito visual
                        finalDamage = 0;
                    }
                    tower.health = Math.max(0, tower.health - finalDamage);
                    this.x = canvas.width + 100;
                } else {
                    const speed = this.baseSpeed * gameSpeed;
                    this.x += (dx / dist) * speed * delta;
                    this.y += (dy / dist) * speed * delta;
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#444';
                ctx.fillRect(this.x - this.radius, this.y - this.radius - 20, this.radius * 2, 5);
                if (this.health > 0) {
                    ctx.fillStyle = this.health > this.maxHealth * 0.5 ? '#4CAF50' : '#f44336';
                    ctx.fillRect(this.x - this.radius, this.y - this.radius - 20, (this.health / this.maxHealth) * (this.radius * 2), 5);
                }
            }
        }

        class Projectile {
            constructor(target) {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.radius = 8;
                this.speed = 7;
                const dx = target.x - this.x;
                const dy = target.y - this.y;
                const dist = Math.hypot(dx, dy) || 1;
                this.vx = (dx / dist) * this.speed;
                this.vy = (dy / dist) * this.speed;
            }
            update(delta) {
                this.x += this.vx * gameSpeed * delta;
                this.y += this.vy * gameSpeed * delta;
            }
            draw() {
                ctx.fillStyle = 'yellow';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#ff0'; ctx.lineWidth = 2; ctx.stroke();
            }
        }

        function spawnEnemy() {
            if (enemiesThisWave < totalEnemiesForWave && Date.now() - lastEnemySpawn > enemySpawnRate) {
                const isBoss = (wave % 10 === 0 && wave >= 10 && enemiesThisWave === 0);
                enemies.push(new Enemy(isBoss));
                enemiesThisWave++;
                lastEnemySpawn = Date.now();
            }
        }

        function shoot() {
            if (Date.now() - tower.lastShot > (tower.fireRate / gameSpeed) && enemies.length > 0) {
                let closest = null;
                let minDist = Infinity;
                enemies.forEach(enemy => {
                    if (enemy.health <= 0) return;
                    const dist = distance(canvas.width / 2, canvas.height / 2, enemy.x, enemy.y);
                    if (dist < minDist && dist <= tower.range) {
                        minDist = dist;
                        closest = enemy;
                    }
                });
                if (closest) {
                    projectiles.push(new Projectile(closest));
                    tower.lastShot = Date.now();
                }
            }
        }

        function updateUI() {
            waveElement.textContent = `Onda: ${wave}`;
            statCopper.textContent = Math.floor(copper * persistent.copperMultiplier);
            statGold.textContent = persistent.gold;
            healthBar.style.width = `${Math.max(0, (tower.health / tower.maxHealth) * 100)}%`;
            updateStatsUI();
        }

        function checkGameOver() {
            if (tower.health <= 0 && !gameOver) {
                persistent.highScore = Math.max(persistent.highScore, wave - 1);
                updateGameOverUI();
                gameOverScreen.style.display = 'block';
                saveProgress();
                gameOver = true;
                gameOverTime = Date.now();
            }
        }

        function nextWave() {
            if (enemies.length === 0 && enemiesThisWave >= totalEnemiesForWave && !gameOver) {
                wave++;
                totalEnemiesForWave += 3;
                enemiesThisWave = 0;
                enemySpawnRate = Math.max(800, enemySpawnRate - 100 * gameSpeed);
                copper += (wave * 5 + persistent.copperWaveLevel * 5) * persistent.copperMultiplier;
                persistent.gold += (Math.floor(wave / 3) + 1 + persistent.goldWaveLevel);
                saveProgress();
            }
        }

        // Upgrades temporários
        upgradeDamageBtn.addEventListener('click', () => {
            if (copper >= costs.damage) {
                copper -= costs.damage;
                tower.damage += 2;
                costs.damage = Math.floor(costs.damage * 1.6) + 3;
                updateUpgradeButtons();
            }
        });
        upgradeFireRateBtn.addEventListener('click', () => {
            if (copper >= costs.fireRate) {
                copper -= costs.fireRate;
                tower.fireRate = Math.max(200, tower.fireRate - 50);
                costs.fireRate = Math.floor(costs.fireRate * 1.6) + 3;
                updateUpgradeButtons();
            }
        });
        upgradeHealthBtn.addEventListener('click', () => {
            if (copper >= costs.health) {
                copper -= costs.health;
                tower.maxHealth += 10;
                tower.health += 10;
                costs.health = Math.floor(costs.health * 1.6) + 3;
                updateUpgradeButtons();
            }
        });
        upgradeRangeBtn.addEventListener('click', () => {
            if (copper >= costs.range) {
                copper -= costs.range;
                tower.range += 25;
                costs.range = Math.floor(costs.range * 1.6) + 3;
                updateUpgradeButtons();
            }
        });

        colorPicker.addEventListener('input', () => {
            tower.color = persistent.color = colorPicker.value;
            saveProgress();
        });

        // Abas dos upgrades
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
            });
        });

        // Meta upgrades
        document.getElementById('metaDamage').addEventListener('click', () => { 
            if (persistent.gold >= 20) { persistent.gold -= 20; persistent.damageLevel += 1; updateGameOverUI(); saveProgress(); updateMetaLevels(); } 
        });
        document.getElementById('metaFireRate').addEventListener('click', () => { 
            if (persistent.gold >= 30) { persistent.gold -= 30; persistent.fireRateLevel += 1; updateGameOverUI(); saveProgress(); updateMetaLevels(); } 
        });
        document.getElementById('metaHealth').addEventListener('click', () => { 
            if (persistent.gold >= 50) { persistent.gold -= 50; persistent.healthLevel += 1; updateGameOverUI(); saveProgress(); updateMetaLevels(); } 
        });
        document.getElementById('metaRange').addEventListener('click', () => { 
            if (persistent.gold >= 40) { persistent.gold -= 40; persistent.rangeLevel += 1; updateGameOverUI(); saveProgress(); updateMetaLevels(); } 
        });
        document.getElementById('metaCritChance').addEventListener('click', () => { 
            if (persistent.gold >= 50) { persistent.gold -= 50; persistent.critChanceLevel += 1; updateGameOverUI(); saveProgress(); updateMetaLevels(); } 
        });
        document.getElementById('metaRegen').addEventListener('click', () => { 
            if (persistent.gold >= 60) { persistent.gold -= 60; persistent.regenLevel += 1; updateGameOverUI(); saveProgress(); updateMetaLevels(); } 
        });
        document.getElementById('metaDamageReduction').addEventListener('click', () => { 
            if (persistent.gold >= 70) { persistent.gold -= 70; persistent.damageReductionLevel += 1; updateGameOverUI(); saveProgress(); updateMetaLevels(); } 
        });
        document.getElementById('metaDodgeChance').addEventListener('click', () => { 
            if (persistent.gold >= 80) { persistent.gold -= 80; persistent.dodgeChanceLevel += 1; updateGameOverUI(); saveProgress(); updateMetaLevels(); } 
        });
        document.getElementById('metaGoldWave').addEventListener('click', () => { 
            if (persistent.gold >= 50) { persistent.gold -= 50; persistent.goldWaveLevel += 1; updateGameOverUI(); saveProgress(); updateMetaLevels(); } 
        });
        document.getElementById('metaCopperWave').addEventListener('click', () => { 
            if (persistent.gold >= 40) { persistent.gold -= 40; persistent.copperWaveLevel += 1; updateGameOverUI(); saveProgress(); updateMetaLevels(); } 
        });
        document.getElementById('metaCopperKill').addEventListener('click', () => { 
            if (persistent.gold >= 45) { persistent.gold -= 45; persistent.copperKillLevel += 1; updateGameOverUI(); saveProgress(); updateMetaLevels(); } 
        });
        document.getElementById('metaGoldKillChance').addEventListener('click', () => { 
            if (persistent.gold >= 60) { persistent.gold -= 60; persistent.goldKillChanceLevel += 1; updateGameOverUI(); saveProgress(); updateMetaLevels(); } 
        });
        document.getElementById('metaGoldKillAmount').addEventListener('click', () => { 
            if (persistent.gold >= 100) { persistent.gold -= 100; persistent.goldKillAmountLevel += 1; updateGameOverUI(); saveProgress(); updateMetaLevels(); } 
        });
        document.getElementById('metaStartingGold').addEventListener('click', () => { 
            if (persistent.gold >= 150) { persistent.gold -= 150; persistent.startingGoldLevel += 1; updateGameOverUI(); saveProgress(); updateMetaLevels(); } 
        });

        // Prestígio com requisitos
        prestigeResetBtn.addEventListener('click', () => {
            if ((wave - 1) < 50 || persistent.gold < 1000) {
                alert(`Requisitos não atendidos!\nPrecisa sobreviver ≥ 50 ondas e ter ≥ 1000 ouro total.`);
                return;
            }
            prestigeConfirmDiv.style.display = 'block';
        });

        confirmPrestigeBtn.addEventListener('click', () => {
            if (prestigeInput.value.trim() === 'gswolf101') {
                persistent.damageLevel = 0;
                persistent.fireRateLevel = 0;
                persistent.healthLevel = 0;
                persistent.rangeLevel = 0;
                persistent.critChanceLevel = 0;
                persistent.regenLevel = 0;
                persistent.damageReductionLevel = 0;
                persistent.dodgeChanceLevel = 0;
                persistent.goldWaveLevel = 0;
                persistent.copperWaveLevel = 0;
                persistent.copperKillLevel = 0;
                persistent.goldKillChanceLevel = 0;
                persistent.goldKillAmountLevel = 0;
                persistent.startingGoldLevel = 0;
                persistent.prestigeCount = (persistent.prestigeCount || 0) + 1;
                prestigeConfirmDiv.style.display = 'none';
                prestigeInput.value = '';
                updateGameOverUI();
                saveProgress();
                alert(`Prestígio realizado!\nMultiplicador permanente: ${(1 + persistent.prestigeCount * 0.1).toFixed(2)}×`);
            } else {
                alert('Código incorreto!');
            }
        });

        restartBtn.addEventListener('click', () => {
            newRun();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            lastTime = 0;
            animationFrameId = requestAnimationFrame(gameLoop);
        });

        speedToggle.addEventListener('click', () => {
            gameSpeed = gameSpeed === 1 ? 2 : 1;
            speedToggle.textContent = `2x Speed (${gameSpeed === 2 ? 'ON' : 'OFF'})`;
            speedToggle.classList.toggle('active', gameSpeed === 2);
        });

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const delta = (timestamp - lastTime) / 16.67;
            lastTime = timestamp;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(ZOOM, ZOOM);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);

            // Efeito de game over (piscando vermelho)
            if (gameOver) {
                const flash = Math.sin((timestamp - gameOverTime) / 300) * 0.3 + 0.3;
                ctx.fillStyle = `rgba(139, 0, 0, ${flash})`;
                ctx.fillRect(-canvas.width, -canvas.height, canvas.width * 2, canvas.height * 2);
            }

            // Efeito de esquiva (piscando branco rápido na torre)
            if (dodgeFlash && Date.now() - dodgeFlash < 300) {
                const flash = Math.sin((Date.now() - dodgeFlash) / 50) * 0.5 + 0.5;
                ctx.fillStyle = `rgba(255, 255, 255, ${flash})`;
                ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, tower.size / 2 + 10, 0, Math.PI * 2); ctx.fill();
            }

            // Regeneração
            if (tower.regenPerSecond > 0 && !gameOver) {
                const now = Date.now();
                const elapsed = (now - tower.lastRegen) / 1000;
                tower.health = Math.min(tower.maxHealth, tower.health + tower.regenPerSecond * elapsed);
                tower.lastRegen = now;
            }

            // Torre
            ctx.fillStyle = tower.color;
            ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, tower.size / 2, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();

            // Alcance
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, tower.range, 0, Math.PI * 2); ctx.stroke();

            // Onda
            ctx.font = 'bold 40px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.fillText(`Onda ${wave}`, canvas.width / 2, 60);

            if (!gameOver) {
                spawnEnemy();
                shoot();

                // Inimigos
                for (let i = enemies.length - 1; i >= 0; i--) {
                    enemies[i].update(delta);
                    enemies[i].draw();
                    if (enemies[i].health <= 0) {
                        copper += (Math.floor(random(1, 6) + persistent.copperKillLevel) * persistent.copperMultiplier);
                        if (Math.random() < persistent.goldKillChanceLevel * 0.005 + 0.02) { 
                            persistent.gold += 1 + persistent.goldKillAmountLevel; 
                            saveProgress(); 
                        }
                        enemies.splice(i, 1);
                    } else if (Math.abs(enemies[i].x - canvas.width / 2) > canvas.width * 2) {
                        enemies.splice(i, 1);
                    }
                }

                // Projéteis
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    projectiles[i].update(delta);
                    projectiles[i].draw();

                    for (let j = enemies.length - 1; j >= 0; j--) {
                        if (enemies[j].health <= 0) continue;
                        const dist = distance(projectiles[i].x, projectiles[i].y, enemies[j].x, enemies[j].y);
                        if (dist < projectiles[i].radius + enemies[j].radius) {
                            let finalDamage = tower.damage;
                            if (Math.random() < tower.critChance) finalDamage *= 2; // Crítico
                            enemies[j].health -= finalDamage;
                            projectiles.splice(i, 1);
                            break;
                        }
                    }

                    if (projectiles[i] && (projectiles[i].x < -100 || projectiles[i].x > canvas.width + 100 || projectiles[i].y < -100 || projectiles[i].y > canvas.height + 100)) {
                        projectiles.splice(i, 1);
                    }
                }

                updateUI();
                checkGameOver();
                nextWave();
            }

            ctx.restore();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        resizeCanvas();
        loadSave();
        updateUpgradeButtons();
        updateStatsUI();
        updateMetaLevels();
        animationFrameId = requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
