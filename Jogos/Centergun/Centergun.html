<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centergun</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; margin: 0; background-color: #222; color: #fff; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
        #game-container { position: relative; margin-top: 10px; flex: 1; display: flex; justify-content: center; align-items: center; }
        canvas { background-color: #333; border: 2px solid #fff; display: block; max-width: 100%; max-height: 65vh; }
        #ui { display: flex; justify-content: space-between; width: 100%; max-width: 800px; margin: 5px 0; font-size: 16px; }
        #stats { background: rgba(0,0,0,0.5); padding: 8px; border-radius: 5px; }
        #health-bar-container { width: 200px; height: 20px; background: #555; border: 1px solid #fff; position: relative; margin-top: 5px; }
        #health-bar { height: 100%; background: #4CAF50; width: 100%; transition: width 0.3s; }
        #upgrades { display: flex; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 800px; margin: 5px 0; }
        button { background: #4CAF50; color: white; border: none; padding: 8px 12px; margin: 5px; cursor: pointer; border-radius: 5px; font-size: 14px; }
        button:hover { background: #45a049; }
        button:disabled { background: #666; cursor: not-allowed; }
        #color-picker { margin: 5px; padding: 5px; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 30px; text-align: center; display: none; z-index: 10; border-radius: 10px; max-width: 90%; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
        #meta-upgrades { margin: 20px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 400px; margin: 20px auto; }
        @media (max-width: 600px) { #ui { flex-direction: column; align-items: center; font-size: 14px; } #upgrades { flex-direction: column; align-items: center; } #meta-upgrades { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p>Ondas Sobrevividas: <span id="finalWave">0</span></p>
            <p>Recorde: <span id="highScoreUI">0</span></p>
            <p>Ouro Total: <span id="totalGold">0</span> | Ganho nesta run: <span id="runGoldEarned">0</span></p>
            <h3>Upgrades Permanentes (com Ouro)</h3>
            <div id="meta-upgrades">
                <button id="metaDamage">Dano +1 (20 Ouro) Lv.0</button>
                <button id="metaFireRate">Taxa de Fogo +1 (30 Ouro) Lv.0</button>
                <button id="metaHealth">Vida Máx +1 (50 Ouro) Lv.0</button>
                <button id="metaRange">Alcance +1 (40 Ouro) Lv.0</button>
            </div>
            <button id="restart">Iniciar Nova Partida</button>
        </div>
    </div>
    <div id="ui">
        <div id="wave">Onda: 1</div>
        <div id="stats">
            Dano: <span id="statDamage">15</span> | 
            Taxa: <span id="statFireRate">1.25</span>/s | 
            Alcance: <span id="statRange">180</span> | 
            Vida Máx: <span id="statMaxHealth">150</span>
        </div>
        <div>
            Vida da Torre:
            <div id="health-bar-container"><div id="health-bar"></div></div>
        </div>
    </div>
    <div id="upgrades">
        <button id="upgradeDamage">Upgrade Dano (+2) (Custo: 5 Cobre)</button>
        <button id="upgradeFireRate">Upgrade Taxa de Fogo (Custo: 5 Cobre)</button>
        <button id="upgradeHealth">Upgrade Vida (+10) (Custo: 5 Cobre)</button>
        <button id="upgradeRange">Upgrade Alcance (+25) (Custo: 5 Cobre)</button>
        <label>Cor da Torre: <input type="color" id="color-picker" value="#0000FF"></label>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const waveElement = document.getElementById('wave');
        const copperElement = document.getElementById('copper');
        const goldElement = document.getElementById('goldUI');
        const healthBar = document.getElementById('health-bar');
        const statDamage = document.getElementById('statDamage');
        const statFireRate = document.getElementById('statFireRate');
        const statRange = document.getElementById('statRange');
        const statMaxHealth = document.getElementById('statMaxHealth');
        const upgradeDamageBtn = document.getElementById('upgradeDamage');
        const upgradeFireRateBtn = document.getElementById('upgradeFireRate');
        const upgradeHealthBtn = document.getElementById('upgradeHealth');
        const upgradeRangeBtn = document.getElementById('upgradeRange');
        const colorPicker = document.getElementById('color-picker');
        const gameOverScreen = document.getElementById('game-over');
        const finalWaveEl = document.getElementById('finalWave');
        const highScoreUIEl = document.getElementById('highScoreUI');
        const totalGoldEl = document.getElementById('totalGold');
        const runGoldEarnedEl = document.getElementById('runGoldEarned');
        const restartBtn = document.getElementById('restart');

        // Persistent e run vars
        let persistent = { gold: 0, damageLevel: 0, fireRateLevel: 0, healthLevel: 0, rangeLevel: 0, highScore: 0, color: '#0000FF' };
        let copper = 0;
        let runStartGold = 0;
        let costs = { damage: 5, fireRate: 5, health: 5, range: 5 };

        const ZOOM = 0.5;
        const TOWER_SIZE = 50;

        let tower = {
            size: TOWER_SIZE,
            health: 150,
            maxHealth: 150,
            damage: 15,
            fireRate: 800,
            range: 180,
            color: '#0000FF',
            lastShot: 0
        };

        let enemies = [];
        let projectiles = [];
        let wave = 1;
        let enemiesThisWave = 0;
        let totalEnemiesForWave = 5;
        let gameOver = false;
        let lastEnemySpawn = 0;
        let enemySpawnRate = 3000;
        let animationFrameId = null;

        function resizeCanvas() {
            const maxW = window.innerWidth * 0.95;
            const maxH = window.innerHeight * 0.65;
            let targetW = Math.min(800, maxW);
            let targetH = targetW * (600 / 800);
            if (targetH > maxH) { targetH = maxH; targetW = targetH * (800 / 600); }
            canvas.width = targetW;
            canvas.height = targetH;
        }
        window.addEventListener('resize', resizeCanvas);

        function random(min, max) { return Math.random() * (max - min) + min; }
        function distance(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

        function saveProgress() { localStorage.setItem('centergunSave', JSON.stringify(persistent)); }

        function loadSave() {
            const save = JSON.parse(localStorage.getItem('centergunSave')) || {};
            Object.assign(persistent, { gold: save.gold || 0, damageLevel: save.damageLevel || 0, fireRateLevel: save.fireRateLevel || 0,
                healthLevel: save.healthLevel || 0, rangeLevel: save.rangeLevel || 0, highScore: save.highScore || 0, color: save.color || '#0000FF' });
            tower.color = persistent.color;
            colorPicker.value = tower.color;
            newRun();
        }

        function newRun() {
            tower.damage = 15 + persistent.damageLevel * 2;
            tower.fireRate = Math.max(200, 800 - persistent.fireRateLevel * 50);
            tower.range = 180 + persistent.rangeLevel * 20;
            tower.maxHealth = 150 + persistent.healthLevel * 20;
            tower.health = tower.maxHealth;
            tower.lastShot = 0;

            copper = 0;
            costs = { damage: 5, fireRate: 5, health: 5, range: 5 };
            wave = 1;
            enemies = [];
            projectiles = [];
            enemiesThisWave = 0;
            totalEnemiesForWave = 5;
            lastEnemySpawn = 0;
            enemySpawnRate = 3000;
            gameOver = false;
            gameOverScreen.style.display = 'none';
            runStartGold = persistent.gold;

            updateUpgradeButtons();
            updateStatsUI();
        }

        function updateStatsUI() {
            statDamage.textContent = tower.damage;
            statFireRate.textContent = (1000 / tower.fireRate).toFixed(2);
            statRange.textContent = Math.round(tower.range);
            statMaxHealth.textContent = tower.maxHealth;
        }

        function updateUpgradeButtons() {
            upgradeDamageBtn.textContent = `Upgrade Dano (+2) (Custo: ${costs.damage} Cobre)`;
            upgradeFireRateBtn.textContent = `Upgrade Taxa de Fogo (Custo: ${costs.fireRate} Cobre)`;
            upgradeHealthBtn.textContent = `Upgrade Vida (+10) (Custo: ${costs.health} Cobre)`;
            upgradeRangeBtn.textContent = `Upgrade Alcance (+25) (Custo: ${costs.range} Cobre)`;
        }

        function updateMetaUI() {
            document.getElementById('metaDamage').textContent = `Dano +1 (20 Ouro) Lv.${persistent.damageLevel}`;
            document.getElementById('metaFireRate').textContent = `Taxa de Fogo +1 (30 Ouro) Lv.${persistent.fireRateLevel}`;
            document.getElementById('metaHealth').textContent = `Vida Máx +1 (50 Ouro) Lv.${persistent.healthLevel}`;
            document.getElementById('metaRange').textContent = `Alcance +1 (40 Ouro) Lv.${persistent.rangeLevel}`;
        }

        function updateGameOverUI() {
            totalGoldEl.textContent = persistent.gold;
            runGoldEarnedEl.textContent = persistent.gold - runStartGold;
            highScoreUIEl.textContent = persistent.highScore;
            finalWaveEl.textContent = wave - 1;
            updateMetaUI();
        }

        class Enemy {
            constructor() {
                const angle = random(0, Math.PI * 2);
                const spawnDist = tower.range / ZOOM + 200 + random(0, 300);
                this.x = canvas.width / 2 + Math.cos(angle) * spawnDist;
                this.y = canvas.height / 2 + Math.sin(angle) * spawnDist;
                this.radius = 10;
                const growthFactor = Math.pow(1.15, wave - 1);
                this.health = Math.floor(30 * growthFactor + random(0, 20));
                this.maxHealth = this.health;
                this.damage = Math.floor(15 * Math.pow(1.12, wave - 1));
                const speedGrowth = Math.pow(1.09, wave - 1);
                this.speed = 0.5 + 0.3 * speedGrowth + random(-0.1, 0.3);
            }
            update() {
                const dx = canvas.width / 2 - this.x;
                const dy = canvas.height / 2 - this.y;
                const dist = Math.hypot(dx, dy);
                if (dist < tower.size / 2 + this.radius) {
                    tower.health = Math.max(0, tower.health - this.damage);
                    this.x = canvas.width + 100;
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
            }
            draw() {
                ctx.fillStyle = 'red';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#444';
                ctx.fillRect(this.x - 12, this.y - 28, 24, 5);
                if (this.health > 0) {
                    ctx.fillStyle = this.health > this.maxHealth * 0.5 ? '#4CAF50' : '#f44336';
                    ctx.fillRect(this.x - 12, this.y - 28, (this.health / this.maxHealth) * 24, 5);
                }
            }
        }

        class Projectile {
            constructor(target) {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.radius = 8;
                this.speed = 7;
                const dx = target.x - this.x;
                const dy = target.y - this.y;
                const dist = Math.hypot(dx, dy) || 1;
                this.vx = (dx / dist) * this.speed;
                this.vy = (dy / dist) * this.speed;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
            }
            draw() {
                ctx.fillStyle = 'yellow';
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#ff0'; ctx.lineWidth = 2; ctx.stroke();
            }
        }

        function spawnEnemy() {
            if (enemiesThisWave < totalEnemiesForWave && Date.now() - lastEnemySpawn > enemySpawnRate) {
                enemies.push(new Enemy());
                enemiesThisWave++;
                lastEnemySpawn = Date.now();
            }
        }

        function shoot() {
            if (Date.now() - tower.lastShot > tower.fireRate && enemies.length > 0) {
                let closest = null;
                let minDist = Infinity;
                enemies.forEach(enemy => {
                    if (enemy.health <= 0) return;
                    const dist = distance(canvas.width / 2, canvas.height / 2, enemy.x, enemy.y);
                    if (dist < minDist && dist <= tower.range) {
                        minDist = dist;
                        closest = enemy;
                    }
                });
                if (closest) {
                    projectiles.push(new Projectile(closest));
                    tower.lastShot = Date.now();
                }
            }
        }

        function updateUI() {
            waveElement.textContent = `Onda: ${wave}`;
            copperElement.textContent = `Cobre: ${Math.floor(copper)}`;
            goldElement.textContent = `Ouro: ${persistent.gold}`;
            healthBar.style.width = `${Math.max(0, (tower.health / tower.maxHealth) * 100)}%`;
            updateStatsUI();
        }

        function checkGameOver() {
            if (tower.health <= 0) {
                persistent.highScore = Math.max(persistent.highScore, wave - 1);
                updateGameOverUI();
                gameOverScreen.style.display = 'block';
                saveProgress();
                gameOver = true;
            }
        }

        function nextWave() {
            if (enemies.length === 0 && enemiesThisWave >= totalEnemiesForWave) {
                wave++;
                totalEnemiesForWave += 3;
                enemiesThisWave = 0;
                enemySpawnRate = Math.max(800, enemySpawnRate - 100);
                copper += wave * 5;
                persistent.gold += Math.floor(wave / 3) + 1;
                saveProgress();
            }
        }

        // Upgrades temporários
        upgradeDamageBtn.addEventListener('click', () => {
            if (copper >= costs.damage) {
                copper -= costs.damage;
                tower.damage += 2;
                costs.damage = Math.floor(costs.damage * 1.6) + 3;
                updateUpgradeButtons();
            }
        });
        upgradeFireRateBtn.addEventListener('click', () => {
            if (copper >= costs.fireRate) {
                copper -= costs.fireRate;
                tower.fireRate = Math.max(200, tower.fireRate - 50);
                costs.fireRate = Math.floor(costs.fireRate * 1.6) + 3;
                updateUpgradeButtons();
            }
        });
        upgradeHealthBtn.addEventListener('click', () => {
            if (copper >= costs.health) {
                copper -= costs.health;
                tower.maxHealth += 10;
                tower.health += 10;
                costs.health = Math.floor(costs.health * 1.6) + 3;
                updateUpgradeButtons();
            }
        });
        upgradeRangeBtn.addEventListener('click', () => {
            if (copper >= costs.range) {
                copper -= costs.range;
                tower.range += 25;
                costs.range = Math.floor(costs.range * 1.6) + 3;
                updateUpgradeButtons();
            }
        });

        colorPicker.addEventListener('input', () => {
            tower.color = persistent.color = colorPicker.value;
            saveProgress();
        });

        // Meta upgrades
        document.getElementById('metaDamage').addEventListener('click', () => { if (persistent.gold >= 20) { persistent.gold -= 20; persistent.damageLevel += 1; updateGameOverUI(); saveProgress(); } });
        document.getElementById('metaFireRate').addEventListener('click', () => { if (persistent.gold >= 30) { persistent.gold -= 30; persistent.fireRateLevel += 1; updateGameOverUI(); saveProgress(); } });
        document.getElementById('metaHealth').addEventListener('click', () => { if (persistent.gold >= 50) { persistent.gold -= 50; persistent.healthLevel += 1; updateGameOverUI(); saveProgress(); } });
        document.getElementById('metaRange').addEventListener('click', () => { if (persistent.gold >= 40) { persistent.gold -= 40; persistent.rangeLevel += 1; updateGameOverUI(); saveProgress(); } });

        restartBtn.addEventListener('click', () => {
            newRun();
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = requestAnimationFrame(gameLoop);
        });

        function gameLoop() {
            if (gameOver) {
                animationFrameId = null;
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(ZOOM, ZOOM);
            ctx.translate(-canvas.width / 2, -canvas.height / 2);

            // Torre
            ctx.fillStyle = tower.color;
            ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, tower.size / 2, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();

            // Alcance
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, tower.range, 0, Math.PI * 2); ctx.stroke();

            // Onda (posição y = 60)
            ctx.font = 'bold 40px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.fillText(`Onda ${wave}`, canvas.width / 2, 60);

            spawnEnemy();
            shoot();

            // Inimigos
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update();
                enemies[i].draw();
                if (enemies[i].health <= 0) {
                    copper += Math.floor(random(1, 6));
                    if (Math.random() < 0.02) { persistent.gold += 1; saveProgress(); }
                    enemies.splice(i, 1);
                } else if (Math.abs(enemies[i].x - canvas.width / 2) > canvas.width * 2) {
                    enemies.splice(i, 1);
                }
            }

            // Projéteis
            for (let i = projectiles.length - 1; i >= 0; i--) {
                projectiles[i].update();
                projectiles[i].draw();

                // Colisão
                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (enemies[j].health <= 0) continue;
                    const dist = distance(projectiles[i].x, projectiles[i].y, enemies[j].x, enemies[j].y);
                    if (dist < projectiles[i].radius + enemies[j].radius) {
                        enemies[j].health -= tower.damage;
                        projectiles.splice(i, 1);
                        break;
                    }
                }

                if (projectiles[i] && (projectiles[i].x < -100 || projectiles[i].x > canvas.width + 100 || projectiles[i].y < -100 || projectiles[i].y > canvas.height + 100)) {
                    projectiles.splice(i, 1);
                }
            }

            ctx.restore();

            updateUI();
            checkGameOver();
            nextWave();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        resizeCanvas();
        loadSave();
        updateUpgradeButtons();
        updateStatsUI();
        animationFrameId = requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
