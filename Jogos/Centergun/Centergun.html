<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centergun</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; margin: 0; background-color: #222; color: #fff; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }
        #game-container { position: relative; margin-top: 10px; flex: 1; display: flex; justify-content: center; align-items: center; width: 100%; max-width: 800px; }
        canvas { background-color: #333; border: 2px solid #fff; display: block; width: 100%; max-height: 65vh; }
        #game-controls { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; z-index: 5; }
        #end-game-btn { background: #ff4444; color: white; padding: 6px 12px; font-size: 13px; border: none; border-radius: 5px; cursor: pointer; }
        #end-game-btn:hover { background: #cc0000; }
        #speedToggle { background: #555; color: white; padding: 6px 12px; font-size: 13px; border: none; border-radius: 5px; cursor: pointer; }
        #speedToggle.active { background: #ff4444; }
        #game-info { margin: 10px 0; width: 100%; max-width: 800px; text-align: center; }
        #health-container { margin: 10px 0; width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; }
        #health-bar-container { width: 70%; height: 20px; background: #555; border: 1px solid #fff; position: relative; }
        #health-bar { height: 100%; background: #4CAF50; width: 100%; transition: width 0.3s; }
        #color-container { display: flex; align-items: center; gap: 10px; }
        #upgrades-tabs { margin: 10px 0; text-align: center; width: 100%; max-width: 800px; }
        .tab-button { background: #555; color: white; border: none; padding: 10px 20px; margin: 0 5px; cursor: pointer; border-radius: 5px 5px 0 0; }
        .tab-button.active { background: #4CAF50; }
        #upgrades-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; width: 100%; max-width: 800px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 0 5px 5px 5px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        button { background: #4CAF50; color: white; border: none; padding: 8px 12px; margin: 5px; cursor: pointer; border-radius: 5px; font-size: 14px; }
        button:hover { background: #45a049; }
        button:disabled { background: #666; cursor: not-allowed; }
        .icon { margin-right: 5px; font-size: 1.1em; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 30px; text-align: center; display: none; z-index: 10; border-radius: 10px; max-width: 90%; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
        @media (max-width: 600px) { #ui { flex-direction: column; align-items: center; font-size: 14px; } #health-container { flex-direction: column; } #upgrades-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game-controls">
            <button id="endGameBtn">Encerrar Partida</button>
            <button id="speedToggle">2x Speed (OFF)</button>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="game-info">
        <div id="wave">Onda: 1</div>
        <div id="stats">
            <span class="icon">🪙</span> Cobre: <span id="statCopper">0</span> | 
            <span class="icon">🥇</span> Ouro: <span id="statGold">0</span>
        </div>
    </div>

    <div id="health-container">
        <div>
            Vida da Torre:
            <div id="health-bar-container"><div id="health-bar"></div></div>
        </div>
        <div id="color-container">
            Cor da Torre: <input type="color" id="color-picker" value="#0000FF">
        </div>
    </div>

    <div id="upgrades-tabs">
        <button class="tab-button active" data-tab="attack">Ataque</button>
        <button class="tab-button" data-tab="vida">Vida</button>
        <button class="tab-button" data-tab="defesa">Defesa</button>
        <button class="tab-button" data-tab="ganhos">Ganhos</button>
    </div>

    <div id="upgrades-grid">
        <!-- Ataque (permanentes e temporários) -->
        <div class="tab-content active" id="tab-attack">
            <button id="metaDamage">Dano +1 (20 Ouro) Lv.<span id="lvDamage">0</span></button>
            <button id="upgradeDamageTemp">Dano +2 (5 Cobre)</button>
            <button id="metaFireRate">Velocidade Ataque +1 (30 Ouro) Lv.<span id="lvFireRate">0</span></button>
            <button id="upgradeFireRateTemp">Taxa de Ataque +50ms (5 Cobre)</button>
            <button id="metaRange">Alcance +1 (40 Ouro) Lv.<span id="lvRange">0</span></button>
            <button id="upgradeRangeTemp">Alcance +25 (5 Cobre)</button>
            <button id="metaCritChance">Chance Crítico +1% (50 Ouro) Lv.<span id="lvCritChance">0</span></button>
        </div>

        <!-- Vida -->
        <div class="tab-content" id="tab-vida">
            <button id="metaHealth">Vida Máx +1 (50 Ouro) Lv.<span id="lvHealth">0</span></button>
            <button id="upgradeHealthTemp">Vida +10 (5 Cobre)</button>
            <button id="metaRegen">Regeneração +0.1/s (60 Ouro) Lv.<span id="lvRegen">0</span></button>
        </div>

        <!-- Defesa -->
        <div class="tab-content" id="tab-defesa">
            <button id="metaDamageReduction">Dano Reduzido +1 (70 Ouro) Lv.<span id="lvDamageReduction">0</span></button>
            <button id="metaDodgeChance">Chance Esquiva +0.5% (80 Ouro) Lv.<span id="lvDodgeChance">0</span></button>
        </div>

        <!-- Ganhos -->
        <div class="tab-content" id="tab-ganhos">
            <button id="metaGoldWave">Ouro por onda +1 (50 Ouro) Lv.<span id="lvGoldWave">0</span></button>
            <button id="metaCopperWave">Cobre por onda +5 (40 Ouro) Lv.<span id="lvCopperWave">0</span></button>
            <button id="metaCopperKill">Cobre por eliminação +1 (45 Ouro) Lv.<span id="lvCopperKill">0</span></button>
            <button id="metaGoldKillChance">Chance ouro por kill +0.5% (60 Ouro) Lv.<span id="lvGoldKillChance">0</span></button>
            <button id="metaGoldKillAmount">Ouro por eliminação +1 (100 Ouro) Lv.<span id="lvGoldKillAmount">0</span></button>
            <button id="metaStartingGold">Dinheiro inicial +50 (150 Ouro) Lv.<span id="lvStartingGold">0</span></button>
        </div>
    </div>

    <div id="game-over">
        <h2>Game Over!</h2>
        <p>Ondas Sobrevividas: <span id="finalWave">0</span></p>
        <p>Recorde: <span id="highScoreUI">0</span></p>
        <p>Ouro Total: <span id="totalGold">0</span> | Ganho nesta run: <span id="runGoldEarned">0</span></p>
        <h3>Upgrades Permanentes (com Ouro)</h3>
        <!-- A mesma estrutura de abas e upgrades permanentes do game-over -->
        <div id="meta-tabs">
            <button class="tab-button active" data-tab="attack">Ataque</button>
            <button class="tab-button" data-tab="vida">Vida</button>
            <button class="tab-button" data-tab="defesa">Defesa</button>
            <button class="tab-button" data-tab="ganhos">Ganhos</button>
        </div>
        <div id="meta-upgrades">
            <!-- Mesmo conteúdo das abas permanentes -->
            <div class="tab-content active" id="tab-attack">
                <button id="metaDamage">Dano +1 (20 Ouro) Lv.<span id="lvDamage">0</span></button>
                <button id="metaFireRate">Velocidade Ataque +1 (30 Ouro) Lv.<span id="lvFireRate">0</span></button>
                <button id="metaRange">Alcance +1 (40 Ouro) Lv.<span id="lvRange">0</span></button>
                <button id="metaCritChance">Chance Crítico +1% (50 Ouro) Lv.<span id="lvCritChance">0</span></button>
            </div>
            <div class="tab-content" id="tab-vida">
                <button id="metaHealth">Vida Máx +1 (50 Ouro) Lv.<span id="lvHealth">0</span></button>
                <button id="metaRegen">Regeneração +0.1/s (60 Ouro) Lv.<span id="lvRegen">0</span></button>
            </div>
            <div class="tab-content" id="tab-defesa">
                <button id="metaDamageReduction">Dano Reduzido +1 (70 Ouro) Lv.<span id="lvDamageReduction">0</span></button>
                <button id="metaDodgeChance">Chance Esquiva +0.5% (80 Ouro) Lv.<span id="lvDodgeChance">0</span></button>
            </div>
            <div class="tab-content" id="tab-ganhos">
                <button id="metaGoldWave">Ouro por onda +1 (50 Ouro) Lv.<span id="lvGoldWave">0</span></button>
                <button id="metaCopperWave">Cobre por onda +5 (40 Ouro) Lv.<span id="lvCopperWave">0</span></button>
                <button id="metaCopperKill">Cobre por eliminação +1 (45 Ouro) Lv.<span id="lvCopperKill">0</span></button>
                <button id="metaGoldKillChance">Chance ouro por kill +0.5% (60 Ouro) Lv.<span id="lvGoldKillChance">0</span></button>
                <button id="metaGoldKillAmount">Ouro por eliminação +1 (100 Ouro) Lv.<span id="lvGoldKillAmount">0</span></button>
                <button id="metaStartingGold">Dinheiro inicial +50 (150 Ouro) Lv.<span id="lvStartingGold">0</span></button>
            </div>
        </div>
        <button id="prestigeReset">Resetar Atributos (Prestígio)</button>
        <div id="prestigeConfirm" style="display:none; margin-top:15px;">
            Digite 'gswolf101' para confirmar:<br>
            <input type="text" id="prestigeInput">
            <button id="confirmPrestige">Confirmar</button>
        </div>
        <button id="restart">Iniciar Nova Partida</button>
    </div>

    <script>
        // ... (o script completo continua igual ao anterior, só com os IDs e listeners já ajustados)
        // Inclua aqui todo o JavaScript do jogo (Enemy, Projectile, gameLoop, etc.) da versão anterior que funcionava.
        // Para não repetir tudo aqui (já que é longo), assuma que o script é o mesmo da última versão funcional, com as adições abaixo:

        // Botão Encerrar Partida
        endGameBtn.addEventListener('click', () => {
            if (!gameOver) {
                gameOver = true;
                gameOverTime = Date.now();
                gameOverScreen.style.display = 'block';
                updateGameOverUI();
                saveProgress();
            }
        });

        // 2x Speed
        speedToggle.addEventListener('click', () => {
            gameSpeed = gameSpeed === 1 ? 2 : 1;
            speedToggle.textContent = `2x Speed (${gameSpeed === 2 ? 'ON' : 'OFF'})`;
            speedToggle.classList.toggle('active', gameSpeed === 2);
        });

        // Abas (permanentes e temporárias compartilham o mesmo comportamento de switch)
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                const parent = btn.closest('#meta-tabs, #meta-tabs-copper');
                parent.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                parent.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
            });
        });

        // ... (resto do script: resizeCanvas, random, distance, save/load, newRun, classes, spawnEnemy, shoot, updateUI, checkGameOver, nextWave, meta buttons listeners, prestígio, restart, gameLoop)

        resizeCanvas();
        loadSave();
        updateUpgradeButtons();
        updateStatsUI();
        updateMetaLevels();
        animationFrameId = requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
