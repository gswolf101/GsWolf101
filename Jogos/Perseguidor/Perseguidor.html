<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Sobrevivência</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            flex-direction: column;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #gameCanvas {
            border: 2px solid #fff;
            background-color: #000;
            display: none;
        }
        #startScreen, #gameOverScreen {
            text-align: center;
            display: none;
            position: relative;
            width: 800px;
        }
        #startScreen.active, #gameOverScreen.active {
            display: block;
        }
        #scoreDisplay {
            font-size: 24px;
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #fff;
            color: #000;
            border: none;
            margin-top: 10px;
        }
        button:hover {
            background-color: #ccc;
        }
        #backButton, #backButtonGameOver {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 16px;
            padding: 8px 16px;
        }
        #ranking {
            margin-top: 20px;
            font-size: 16px;
        }
        input {
            padding: 8px;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="startScreen" class="active">
        <button id="backButton">Voltar</button>
        <h1>Jogo de Sobrevivência</h1>
        <button id="startButton">Iniciar</button>
        <div id="startRanking" class="ranking"></div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="scoreDisplay">Pontuação: 0</div>
    <div id="gameOverScreen">
        <button id="backButtonGameOver">Voltar</button>
        <h1>Game Over</h1>
        <h3>Sua Pontuação: <span id="finalScore"></span></h3>
        <input id="playerName" type="text" placeholder="Digite seu nome" maxlength="10">
        <button id="submitScoreButton">Registrar Pontuação</button>
        <button id="restartButton">Jogar Novamente</button>
        <div id="gameOverRanking" class="ranking"></div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');
        const submitScoreButton = document.getElementById('submitScoreButton');
        const backButton = document.getElementById('backButton');
        const backButtonGameOver = document.getElementById('backButtonGameOver');
        const playerNameInput = document.getElementById('playerName');
        const finalScoreDisplay = document.getElementById('finalScore');
        const startRanking = document.getElementById('startRanking');
        const gameOverRanking = document.getElementById('gameOverRanking');

        // Configurações do jogo
        const player = {
            x: 400,
            y: 300,
            radius: 20
        };
        const enemies = [
            {
                x: 100,
                y: 100,
                radius: 20,
                speed: 7,
                speedIncrease: 0.0005,
                maxSpeed: 12,
                vx: 0,
                vy: 0,
                friction: 0.98
            }
        ];
        const coins = [];
        const coinRadius = 10;
        const coinSpawnInterval = 2000;
        let score = 0;
        let lastCoinSpawn = 0;
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let rankings = JSON.parse(localStorage.getItem('survivalGameRankings')) || [];
        let cursorX = 400; // Armazenar a posição do cursor
        let cursorY = 300;

        // Atualizar ranking
        function updateRanking(name, score) {
            rankings.push({ name: name || 'Anônimo', score });
            rankings.sort((a, b) => b.score - a.score);
            rankings = rankings.slice(0, 5);
            localStorage.setItem('survivalGameRankings', JSON.stringify(rankings));
            displayRanking();
        }

        // Exibir ranking
        function displayRanking() {
            startRanking.innerHTML = '<h3>Ranking</h3><ol>' + rankings.map(r => `<li>${r.name}: ${r.score}</li>`).join('') + '</ol>';
            gameOverRanking.innerHTML = startRanking.innerHTML;
        }

        // Movimento do jogador com o cursor
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            cursorX = e.clientX - rect.left;
            cursorY = e.clientY - rect.top;
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, cursorX));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, cursorY));
        });

        // Capturar movimento do cursor fora do canvas
        document.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            cursorX = e.clientX - rect.left;
            cursorY = e.clientY - rect.top;
        });

        // Botão Voltar
        backButton.addEventListener('click', () => {
            window.location.href = '../CentralJogos.html';
        });
        backButtonGameOver.addEventListener('click', () => {
            window.location.href = '../CentralJogos.html';
        });

        // Função para gerar moeda
        function spawnCoin(timestamp) {
            if (coins.length >= 2) return;
            const x = Math.random() * (canvas.width - 2 * coinRadius) + coinRadius;
            const y = Math.random() * (canvas.height - 2 * coinRadius) + coinRadius;
            coins.push({ x, y, radius: coinRadius });
            lastCoinSpawn = timestamp;
        }

        // Função de colisão
        function checkCollision(x1, y1, r1, x2, y2, r2) {
            const dx = x1 - x2;
            const dy = y1 - y2;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < r1 + r2;
        }

        // Função para ricochete entre inimigos
        function handleEnemyCollision(enemy1, enemy2) {
            const dx = enemy1.x - enemy2.x;
            const dy = enemy1.y - enemy2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < enemy1.radius + enemy2.radius) {
                // Inverter velocidades para simular ricochete
                const tempVx = enemy1.vx;
                const tempVy = enemy1.vy;
                enemy1.vx = enemy2.vx;
                enemy1.vy = enemy2.vy;
                enemy2.vx = tempVx;
                enemy2.vy = tempVy;

                // Ajustar posições para evitar sobreposição
                const overlap = (enemy1.radius + enemy2.radius - distance) / 2;
                const angle = Math.atan2(dy, dx);
                enemy1.x += overlap * Math.cos(angle);
                enemy1.y += overlap * Math.sin(angle);
                enemy2.x -= overlap * Math.cos(angle);
                enemy2.y -= overlap * Math.sin(angle);
            }
        }

        // Adicionar segundo perseguidor
        function spawnSecondEnemy() {
            if (enemies.length < 2) {
                enemies.push({
                    x: canvas.width - 100,
                    y: canvas.height - 100,
                    radius: 20,
                    speed: 7,
                    speedIncrease: 0.0005,
                    maxSpeed: 12,
                    vx: 0,
                    vy: 0,
                    friction: 0.98
                });
            }
        }

        // Iniciar jogo
        startButton.addEventListener('click', () => {
            gameState = 'playing';
            startScreen.classList.remove('active');
            canvas.style.display = 'block';
            scoreDisplay.style.display = 'block';
            score = 0;
            scoreDisplay.textContent = `Pontuação: ${score}`;
            resetGame();
        });

        // Registrar pontuação
        submitScoreButton.addEventListener('click', () => {
            const name = playerNameInput.value.trim();
            updateRanking(name, score);
            playerNameInput.value = '';
            submitScoreButton.disabled = true;
        });

        // Reiniciar jogo
        restartButton.addEventListener('click', () => {
            gameState = 'playing';
            gameOverScreen.classList.remove('active');
            canvas.style.display = 'block';
            scoreDisplay.style.display = 'block';
            score = 0;
            scoreDisplay.textContent = `Pontuação: ${score}`;
            resetGame();
            submitScoreButton.disabled = false;
        });

        // Resetar estado do jogo
        function resetGame() {
            player.x = 400;
            player.y = 300;
            cursorX = 400;
            cursorY = 300;
            enemies.length = 0;
            enemies.push({
                x: 100,
                y: 100,
                radius: 20,
                speed: 7,
                speedIncrease: 0.0005,
                maxSpeed: 12,
                vx: 0,
                vy: 0,
                friction: 0.98
            });
            coins.length = 0;
            lastCoinSpawn = 0;
        }

        // Loop principal do jogo
        function gameLoop(timestamp) {
            if (gameState !== 'playing') {
                requestAnimationFrame(gameLoop);
                return;
            }

            // Adicionar segundo perseguidor na pontuação 30
            if (score >= 30 && enemies.length < 2) {
                spawnSecondEnemy();
            }

            // Movimento dos inimigos com deslizamento
            enemies.forEach(enemy => {
                const dx = cursorX - enemy.x; // Perseguir o cursor, mesmo fora do canvas
                const dy = cursorY - enemy.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance > 0) {
                    const ax = (dx / distance) * enemy.speed;
                    const ay = (dy / distance) * enemy.speed;
                    enemy.vx += ax * 0.1;
                    enemy.vy += ay * 0.1;
                    enemy.vx *= enemy.friction;
                    enemy.vy *= enemy.friction;
                    enemy.x += enemy.vx;
                    enemy.y += enemy.vy;
                }
                enemy.speed = Math.min(enemy.speed + enemy.speedIncrease, enemy.maxSpeed);

                // Ricochete nas bordas
                if (enemy.x - enemy.radius < 0) {
                    enemy.x = enemy.radius;
                    enemy.vx = -enemy.vx;
                } else if (enemy.x + enemy.radius > canvas.width) {
                    enemy.x = canvas.width - enemy.radius;
                    enemy.vx = -enemy.vx;
                }
                if (enemy.y - enemy.radius < 0) {
                    enemy.y = enemy.radius;
                    enemy.vy = -enemy.vy;
                } else if (enemy.y + enemy.radius > canvas.height) {
                    enemy.y = canvas.height - enemy.radius;
                    enemy.vy = -enemy.vy;
                }
            });

            // Verificar colisão entre inimigos
            if (enemies.length > 1) {
                handleEnemyCollision(enemies[0], enemies[1]);
            }

            // Geração de moedas
            if (timestamp - lastCoinSpawn > coinSpawnInterval) {
                spawnCoin(timestamp);
            }

            // Verificar colisão com moedas
            for (let i = coins.length - 1; i >= 0; i--) {
                if (checkCollision(player.x, player.y, player.radius, coins[i].x, coins[i].y, coins[i].radius)) {
                    coins.splice(i, 1);
                    score += 1;
                    scoreDisplay.textContent = `Pontuação: ${score}`;
                }
            }

            // Verificar colisão com inimigos
            for (let enemy of enemies) {
                if (checkCollision(player.x, player.y, player.radius, enemy.x, enemy.y, enemy.radius)) {
                    gameState = 'gameover';
                    canvas.style.display = 'none';
                    scoreDisplay.style.display = 'none';
                    gameOverScreen.classList.add('active');
                    finalScoreDisplay.textContent = score;
                    break;
                }
            }

            // Desenhar no canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar jogador
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.closePath();

            // Desenhar inimigos
            enemies.forEach(enemy => {
                ctx.beginPath();
                ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'red';
                ctx.fill();
                ctx.closePath();
            });

            // Desenhar moedas
            coins.forEach(coin => {
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'gold';
                ctx.fill();
                ctx.closePath();
            });

            requestAnimationFrame(gameLoop);
        }

        // Inicializar ranking e loop
        displayRanking();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
