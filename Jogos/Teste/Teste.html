<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Tiro com Arco</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="start-screen">
        <h1>Jogo de Tiro com Arco</h1>
        <div class="button-container">
            <button onclick="startGame()">Começar</button>
            <button onclick="showShop()">Loja</button>
            <button onclick="showRanking()">Ranking</button>
            <button id="reset-button" onclick="resetGame()">Resetar Jogo</button>
        </div>
    </div>
    <div id="shop-screen" style="display: none;">
        <h2>Loja</h2>
        <div id="upgrades">
            <button onclick="buyUpgrade('health')">Melhorar Vida (Custo: <span id="health-cost">10</span>)</button>
            <button onclick="buyUpgrade('coin')">Melhorar Moedas (Custo: <span id="coin-cost">10</span>)</button>
        </div>
        <div id="weapons">
            <h3>Armas</h3>
            <button onclick="buyWeapon('crossbow')">Crossbow (Custo: 50)</button>
            <button onclick="buyWeapon('oldPistol')">Pistola Velha (Custo: 100)</button>
            <button onclick="buyWeapon('pistol')">Pistola (Custo: 150)</button>
            <button onclick="buyWeapon('oldRifle')">Rifle Antigo (Custo: 200)</button>
            <button onclick="buyWeapon('rifle')">Rifle (Custo: 250)</button>
        </div>
        <button onclick="backToStart()">Voltar</button>
    </div>
    <div id="ranking-screen" style="display: none;">
        <h2>Ranking</h2>
        <ul id="ranking-list"></ul>
        <button onclick="backToStart()">Voltar</button>
    </div>
    <div id="game-screen" style="display: none;">
        <canvas id="gameCanvas"></canvas>
        <div id="stats">
            <div>Vida: <span id="health">100</span></div>
            <div>Experiência: <span id="xp">0</span>/<span id="xp-needed">10</span></div>
            <div>Moedas: <span id="coins">0</span></div>
            <div>Pontos: <span id="score">0</span></div>
            <div id="cooldown-bar" style="background-color: red; width: 100px; height: 10px;"></div>
        </div>
        <div id="upgrade-screen" style="display: none;">
            <h2>Escolha um Upgrade</h2>
            <div id="upgrade-options"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
