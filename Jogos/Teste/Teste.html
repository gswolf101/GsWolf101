<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Sobrevivência</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            flex-direction: column;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #gameCanvas {
            border: 2px solid #fff;
            background-color: #000;
            display: none;
        }
        #startScreen, #gameOverScreen {
            text-align: center;
            display: none;
        }
        #startScreen.active, #gameOverScreen.active {
            display: block;
        }
        #scoreDisplay {
            font-size: 24px;
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #fff;
            color: #000;
            border: none;
            margin-top: 10px;
        }
        button:hover {
            background-color: #ccc;
        }
        #ranking {
            margin-top: 20px;
            font-size: 16px;
        }
        input {
            padding: 8px;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="startScreen" class="active">
        <h1>Jogo de Sobrevivência</h1>
        <button id="startButton">Iniciar</button>
        <div id="startRanking" class="ranking"></div>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="scoreDisplay">Pontuação: 0</div>
    <div id="gameOverScreen">
        <h1>Game Over</h1>
        <h3>Sua Pontuação: <span id="finalScore"></span></h3>
        <input id="playerName" type="text" placeholder="Digite seu nome" maxlength="10">
        <button id="submitScoreButton">Registrar Pontuação</button>
        <button id="restartButton">Jogar Novamente</button>
        <div id="gameOverRanking" class="ranking"></div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');
        const submitScoreButton = document.getElementById('submitScoreButton');
        const playerNameInput = document.getElementById('playerName');
        const finalScoreDisplay = document.getElementById('finalScore');
        const startRanking = document.getElementById('startRanking');
        const gameOverRanking = document.getElementById('gameOverRanking');

        // Configurações do jogo
        const player = {
            x: 400,
            y: 300,
            radius: 20,
            offsetY: 50 // Jogador fica abaixo do cursor
        };
        const enemy = {
            x: 100,
            y: 100,
            radius: 20,
            speed: 3, // Velocidade inicial aumentada de 2 para 3
            speedIncrease: 0.0005,
            vx: 0, // Velocidade no eixo x para deslizamento
            vy: 0, // Velocidade no eixo y para deslizamento
            friction: 0.95 // Fricção para suavizar o deslizamento
        };
        const coins = [];
        const coinRadius = 10;
        const coinSpawnInterval = 2000;
        let score = 0;
        let lastCoinSpawn = 0;
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let rankings = JSON.parse(localStorage.getItem('rankings')) || [];

        // Atualizar ranking
        function updateRanking(name, score) {
            rankings.push({ name: name || 'Anônimo', score });
            rankings.sort((a, b) => b.score - a.score); // Ordenar do maior para o menor
            rankings = rankings.slice(0, 5); // Manter apenas os 5 melhores
            localStorage.setItem('rankings', JSON.stringify(rankings));
            displayRanking();
        }

        // Exibir ranking
        function displayRanking() {
            startRanking.innerHTML = '<h3>Ranking</h3><ol>' + rankings.map(r => `<li>${r.name}: ${r.score}</li>`).join('') + '</ol>';
            gameOverRanking.innerHTML = startRanking.innerHTML;
        }

        // Movimento do jogador com o cursor
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left;
            player.y = e.clientY - rect.top + player.offsetY;
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));
        });

        // Função para gerar moeda
        function spawnCoin(timestamp) {
            if (coins.length >= 2) return;
            const x = Math.random() * (canvas.width - 2 * coinRadius) + coinRadius;
            const y = Math.random() * (canvas.height - 2 * coinRadius) + coinRadius;
            coins.push({ x, y, radius: coinRadius });
            lastCoinSpawn = timestamp;
        }

        // Função de colisão
        function checkCollision(x1, y1, r1, x2, y2, r2) {
            const dx = x1 - x2;
            const dy = y1 - y2;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < r1 + r2;
        }

        // Iniciar jogo
        startButton.addEventListener('click', () => {
            gameState = 'playing';
            startScreen.classList.remove('active');
            canvas.style.display = 'block';
            scoreDisplay.style.display = 'block';
            score = 0;
            scoreDisplay.textContent = `Pontuação: ${score}`;
            resetGame();
        });

        // Registrar pontuação
        submitScoreButton.addEventListener('click', () => {
            const name = playerNameInput.value.trim();
            updateRanking(name, score);
            playerNameInput.value = '';
            submitScoreButton.disabled = true; // Desativar após registrar
        });

        // Reiniciar jogo
        restartButton.addEventListener('click', () => {
            gameState = 'playing';
            gameOverScreen.classList.remove('active');
            canvas.style.display = 'block';
            scoreDisplay.style.display = 'block';
            score = 0;
            scoreDisplay.textContent = `Pontuação: ${score}`;
            resetGame();
            submitScoreButton.disabled = false; // Reativar botão de registrar
        });

        // Resetar estado do jogo
        function resetGame() {
            player.x = 400;
            player.y = 300;
            enemy.x = 100;
            enemy.y = 100;
            enemy.vx = 0;
            enemy.vy = 0;
            enemy.speed = 3;
            coins.length = 0;
            lastCoinSpawn = 0;
        }

        // Loop principal do jogo
        function gameLoop(timestamp) {
            if (gameState !== 'playing') {
                requestAnimationFrame(gameLoop);
                return;
            }

            // Movimento do inimigo com deslizamento
            const dx = player.x - enemy.x;
            const dy = player.y - enemy.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance > 0) {
                const ax = (dx / distance) * enemy.speed; // Aceleração
                const ay = (dy / distance) * enemy.speed;
                enemy.vx += ax * 0.1; // Suavizar com inércia
                enemy.vy += ay * 0.1;
                enemy.vx *= enemy.friction; // Aplicar fricção
                enemy.vy *= enemy.friction;
                enemy.x += enemy.vx;
                enemy.y += enemy.vy;
            }
            enemy.speed += enemy.speedIncrease;

            // Geração de moedas
            if (timestamp - lastCoinSpawn > coinSpawnInterval) {
                spawnCoin(timestamp);
            }

            // Verificar colisão com moedas
            for (let i = coins.length - 1; i >= 0; i--) {
                if (checkCollision(player.x, player.y, player.radius, coins[i].x, coins[i].y, coins[i].radius)) {
                    coins.splice(i, 1);
                    score += 1;
                    scoreDisplay.textContent = `Pontuação: ${score}`;
                }
            }

            // Verificar colisão com inimigo
            if (checkCollision(player.x, player.y, player.radius, enemy.x, enemy.y, enemy.radius)) {
                gameState = 'gameover';
                canvas.style.display = 'none';
                scoreDisplay.style.display = 'none';
                gameOverScreen.classList.add('active');
                finalScoreDisplay.textContent = score;
            }

            // Desenhar no canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar jogador
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.closePath();

            // Desenhar inimigo
            ctx.beginPath();
            ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'red';
            ctx.fill();
            ctx.closePath();

            // Desenhar moedas
            coins.forEach(coin => {
                ctx.beginPath();
                ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'gold';
                ctx.fill();
                ctx.closePath();
            });

            requestAnimationFrame(gameLoop);
        }

        // Inicializar ranking e loop
        displayRanking();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
