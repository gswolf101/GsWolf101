<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zombies 🎮</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: black;
      color: white;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #Voltar {
      position: absolute;
      top: 10px;
      left: 10px;
    }
    #Voltar a {
      text-decoration: none;
      color: white;
    }
    header {
      padding-top: 20px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: 2px;
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #gameCanvas {
      border: 2px solid white;
    }
    #shop {
      display: none;
      position: absolute;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px;
      border: 2px solid white;
      border-radius: 5px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    #shop h2, #shop h3, #shop h4 {
      margin: 0 0 10px;
    }
    #shop ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #shop li {
      margin: 10px 0;
    }
    #shop button {
      margin-left: 10px;
      padding: 5px 10px;
      background: white;
      color: black;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    #shop button:hover {
      background: yellow;
    }
    #shop-accessories {
      margin-top: 20px;
    }
    #power-selection {
      display: none;
      position: absolute;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px;
      border: 2px solid white;
      border-radius: 5px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    #power-selection h2 {
      margin: 0 0 10px;
    }
    #power-selection button {
      margin: 5px;
      padding: 5px 10px;
      background: white;
      color: black;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    #power-selection button:hover {
      background: yellow;
    }
  </style>
</head>
<body>
  <div id="Voltar">
    <a href="../index.html"><h3><b>← Voltar</b></h3></a>
  </div>

  <header>
    <h1>Zombies</h1>
  </header>

  <main>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="shop">
      <h2>Loja</h2>
      <h3>Moedas: <span id="coin-display">1000</span></h3>
      <h4>Armas</h4>
      <ul>
        <li>
          <span>Glock (2 dano, 500 moedas)</span>
          <button onclick="buyWeapon('glock')">Comprar</button>
        </li>
        <li>
          <span>Rifle Velho (2 dano, 500 moedas)</span>
          <button onclick="buyWeapon('oldRifle')">Comprar</button>
        </li>
        <li>
          <span>SMG (1.5 dano, 400 moedas)</span>
          <button onclick="buyWeapon('smg')">Comprar</button>
        </li>
      </ul>
      <div id="shop-accessories">
        <h4>Acessórios</h4>
        <ul>
          <li>
            <span>Imã Velho (1000 moedas)</span>
            <button onclick="buyAccessory('oldMagnet')">Comprar</button>
            <button onclick="equipAccessory('oldMagnet')">Equipar</button>
            <button onclick="unequipAccessory()">Desequipar</button>
          </li>
          <li>
            <span>Adrenalina (500 moedas)</span>
            <button onclick="buyAccessory('adrenaline')">Comprar</button>
            <button onclick="equipAccessory('adrenaline')">Equipar</button>
            <button onclick="unequipAccessory()">Desequipar</button>
          </li>
        </ul>
      </div>
      <button onclick="closeShop()">Fechar</button>
    </div>
    <div id="power-selection">
      <h2>Escolha um Poder</h2>
      <button onclick="applyPower('electricBullet')">Bala Elétrica</button>
      <button onclick="applyPower('piercing')">Perfuração</button>
      <button onclick="applyPower('hpUp')">HP-Up</button>
      <button onclick="applyPower('forceUp')">Força-Up</button>
      <button onclick="applyPower('supplement')">Suplemento</button>
      <button onclick="applyPower('ricochet')">Ricochete</button>
      <button onclick="applyPower('steelHeart')">Coração de Aço</button>
    </div>
  </main>
    <script>
          // Game setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const shop = document.getElementById('shop');
        const powerSelection = document.getElementById('power-selection');
        const coinDisplay = document.getElementById('coin-display');
        
        let gameState = 'playing'; // 'playing', 'shop', 'powerSelection', 'gameOver'
        let player = {
          x: canvas.width / 2,
          y: canvas.height / 2,
          maxHealth: 100,
          currentHealth: 100,
          damageMultiplier: 1,
          fireRate: 0.5, // Shots per second
          lastShot: 0,
          speed: 5
        };
        let zombies = [];
        let bullets = [];
        let coins = [];
        let bossesDefeated = 0;
        let currentRound = 1;
        let currentWeapon = 'initial';
        let ownedWeapons = ['initial'];
        let ownedAccessories = [];
        let equippedAccessory = null;
        let accessoryCooldowns = { oldMagnet: 0, adrenaline: 0 };
        let playerCoins = 1000;
        let powers = {
          electricBullet: { chance: 0 },
          piercing: { targets: 0 },
          hpUp: { count: 0 },
          forceUp: { count: 0 },
          supplement: { applied: false },
          ricochet: { limit: 0 },
          steelHeart: { applied: false }
        };
        
        // Weapon definitions
        const weapons = {
          initial: { damage: 1, fireRate: 0.5 },
          glock: { damage: 2, fireRate: 0.6 },
          oldRifle: { damage: 2, fireRate: 0.4 },
          smg: { damage: 1.5, fireRate: 1.0 }
        };
        
        // Game loop
        let lastTime = 0;
        function gameLoop(timestamp) {
          const deltaTime = (timestamp - lastTime) / 1000;
          lastTime = timestamp;
        
          if (gameState === 'playing') {
            updateGame(deltaTime);
            drawGame();
          } else if (gameState === 'shop') {
            shop.style.display = 'block';
          } else if (gameState === 'powerSelection') {
            powerSelection.style.display = 'block';
          } else if (gameState === 'gameOver') {
            ctx.fillStyle = 'red';
            ctx.font = '48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2);
          }
        
          updateCooldowns(deltaTime);
          requestAnimationFrame(gameLoop);
        }
        
        // Update game state
        function updateGame(deltaTime) {
          // Player movement (WASD)
          document.addEventListener('keydown', (e) => {
            if (gameState !== 'playing') return;
            if (e.key === 'w') player.y -= player.speed;
            if (e.key === 's') player.y += player.speed;
            if (e.key === 'a') player.x -= player.speed;
            if (e.key === 'd') player.x += player.speed;
            // Keep player in bounds
            player.x = Math.max(10, Math.min(canvas.width - 10, player.x));
            player.y = Math.max(10, Math.min(canvas.height - 10, player.y));
          }, { once: true });
        
          // Shooting (click)
          canvas.addEventListener('click', (e) => {
            if (gameState !== 'playing') return;
            const now = Date.now() / 1000;
            if (now - player.lastShot >= 1 / player.fireRate) {
              shootBullet(e);
              player.lastShot = now;
            }
          }, { once: true });
        
          // Update zombies
          zombies.forEach((zombie, index) => {
            // Move toward player
            const dx = player.x - zombie.x;
            const dy = player.y - zombie.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance > 0) {
              if (zombie.type !== 'chargeBoss' || !zombie.isCharging) {
                zombie.x += (dx / distance) * zombie.speed;
                        zombie.y += (dy / distance) * zombie.speed;
              }
            }
            // Check collision with player
            if (distance < 20) {
              player.currentHealth -= zombie.damage;
              if (player.currentHealth <= 0) {
                gameState = 'gameOver';
              }
            }
            // Long-distance boss projectiles
            if (zombie.type === 'longDistanceBoss' && Math.random() < 0.01) {
              shootBossProjectile(zombie);
            }
            // Charge boss logic
            if (zombie.type === 'chargeBoss' && !zombie.isCharging && Math.random() < 0.005) {
              prepareCharge(zombie);
            }
            if (zombie.isCharging) {
              zombie.chargeDistance -= zombie.speed;
              zombie.x += zombie.chargeDirection.x * zombie.speed;
              zombie.y += zombie.chargeDirection.y * zombie.speed;
              if (zombie.chargeDistance <= 0) {
                zombie.isCharging = false;
              }
            }
          });
        
          // Update bullets
          bullets.forEach((bullet, bulletIndex) => {
            bullet.x += bullet.dx * bullet.speed;
            bullet.y += bullet.dy * bullet.speed;
            if (bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height) {
              bullets.splice(bulletIndex, 1);
              return;
            }
            if (bullet.isEnemy) {
              const distance = Math.sqrt((bullet.x - player.x) ** 2 + (bullet.y - player.y) ** 2);
              if (distance < 10) {
                player.currentHealth -= bullet.damage;
                bullets.splice(bulletIndex, 1);
                if (player.currentHealth <= 0) {
                  gameState = 'gameOver';
                }
              }
              return;
            }
            zombies.forEach((zombie, zombieIndex) => {
              const distance = Math.sqrt((bullet.x - zombie.x) ** 2 + (bullet.y - zombie.y) ** 2);
              if (distance < 20) {
                let damage = bullet.damage * player.damageMultiplier;
                zombie.hp -= damage;
                if (powers.electricBullet.chance > 0 && Math.random() < powers.electricBullet.chance) {
                  const nearbyZombie = findNearestZombie(zombie, 100);
                  if (nearbyZombie) {
                    nearbyZombie.hp -= damage;
                    drawYellowLine(zombie, nearbyZombie);
                  }
                }
                if (powers.ricochet.limit > 0 && bullet.bounces < powers.ricochet.limit) {
                  const nextZombie = findNearestZombie(zombie, 100);
                  if (nextZombie) {
                    bullet.bounces++;
                    bullet.x = nextZombie.x;
                    bullet.y = nextZombie.y;
                    nextZombie.hp -= damage;
                    return;
                  }
                }
                if (powers.piercing.targets > 0) {
                  bullet.pierceCount = (bullet.pierceCount || 0) + 1;
                  if (bullet.pierceCount >= powers.piercing.targets) {
                    bullets.splice(bulletIndex, 1);
                  }
                } else {
                  bullets.splice(bulletIndex, 1);
                }
                if (zombie.hp <= 0) {
                  zombies.splice(zombieIndex, 1);
                  coins.push({ x: zombie.x, y: zombie.y, value: 10 });
                  if (zombie.type === 'longDistanceBoss' || zombie.type === 'chargeBoss') {
                    bossesDefeated++;
                    showPowerSelection();
                  }
                }
              }
            });
          });
        
          // Update coins
          coins.forEach((coin, index) => {
            if (equippedAccessory === 'oldMagnet' && accessoryCooldowns.oldMagnet > 45) {
              const dx = player.x - coin.x;
              const dy = player.y - coin.y;
              const distance = Math.sqrt(dx * dx + dy * dy);
              if (distance > 0) {
                coin.x += (dx / distance) * 5;
                coin.y += (dy / distance) * 5;
              }
            }
            if (Math.sqrt((player.x - coin.x) ** 2 + (player.y - coin.y) ** 2) < 20) {
              playerCoins += coin.value;
              coins.splice(index, 1);
              updateCoinDisplay();
            }
          });
        
          // Spawn zombies
          if (Math.random() < 0.02 && zombies.length < 20) {
            spawnZombie();
          }
          if (currentRound % 10 === 0 && zombies.length === 0) {
            spawnBoss();
            currentRound++;
          }
        }
        
        // Draw game
        function drawGame() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          // Draw player
          ctx.fillStyle = 'blue';
          ctx.beginPath();
          ctx.arc(player.x, player.y, 10, 0, 2 * Math.PI);
          ctx.fill();
          // Draw health bar
          ctx.fillStyle = 'red';
          ctx.fillRect(10, 10, player.currentHealth * 2, 20);
          ctx.strokeStyle = 'white';
          ctx.strokeRect(10, 10, player.maxHealth * 2, 20);
          // Draw zombies
          zombies.forEach(zombie => {
            ctx.fillStyle = zombie.type === 'normal' ? 'green' : 'purple';
            if (zombie.isCharging) {
              ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
              ctx.beginPath();
              ctx.arc(zombie.x, zombie.y, 15, 0, 2 * Math.PI);
              ctx.fill();
            }
            ctx.beginPath();
            ctx.arc(zombie.x, zombie.y, 10, 0, 2 * Math.PI);
            ctx.fill();
          });
          // Draw bullets
          bullets.forEach(bullet => {
            ctx.fillStyle = bullet.isElectric ? 'yellow' : bullet.isEnemy ? 'red' : 'white';
            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, 3, 0, 2 * Math.PI);
            ctx.fill();
          });
          // Draw coins
          coins.forEach(coin => {
            ctx.fillStyle = 'gold';
            ctx.beginPath();
            ctx.arc(coin.x, coin.y, 5, 0, 2 * Math.PI);
            ctx.fill();
          });
        }
        
        // Zombie and boss spawning
        function getZombieHP() {
          return 2 * (1 + 0.65 * bossesDefeated);
        }
        
        function getBossDamage() {
          return 5 * (1 + 0.65 * bossesDefeated);
        }
        
        function spawnZombie() {
          const side = Math.floor(Math.random() * 4);
          let x, y;
          if (side === 0) { x = Math.random() * canvas.width; y = 0; }
          else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height; }
          else if (side === 2) { x = 0; y = Math.random() * canvas.height; }
          else { x = canvas.width; y = Math.random() * canvas.height; }
          zombies.push({
            x, y,
            hp: getZombieHP(),
            damage: 1,
            speed: 2,
            type: 'normal'
          });
        }
        
        function spawnBoss() {
          const bossType = Math.random() < 0.5 ? 'longDistanceBoss' : 'chargeBoss';
          const side = Math.floor(Math.random() * 4);
          let x, y;
          if (side === 0) { x = Math.random() * canvas.width; y = 0; }
          else if (side === 1) { x = Math.random() * canvas.width; y = canvas.height; }
          else if (side === 2) { x = 0; y = Math.random() * canvas.height; }
          else { x = canvas.width; y = Math.random() * canvas.height; }
          zombies.push({
            x, y,
            hp: getZombieHP() * 10,
            damage: getBossDamage(),
            speed: bossType === 'chargeBoss' ? 5 : 3,
            type: bossType,
            isCharging: false,
            chargeDistance: 0,
            chargeDirection: null
          });
        }
        
        // Shooting
        function shootBullet(event) {
          const rect = canvas.getBoundingClientRect();
          const mouseX = event.clientX - rect.left;
          const mouseY = event.clientY - rect.top;
          const dx = mouseX - player.x;
          const dy = mouseY - player.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          bullets.push({
            x: player.x,
            y: player.y,
            dx: dx / distance,
            dy: dy / distance,
            speed: 10,
            damage: weapons[currentWeapon].damage,
            isElectric: powers.electricBullet.chance > 0,
            pierceCount: 0,
            bounces: 0,
            isEnemy: false
          });
        }
        
        function shootBossProjectile(boss) {
          const dx = player.x - boss.x;
          const dy = player.y - boss.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          bullets.push({
            x: boss.x,
            y: boss.y,
            dx: dx / distance,
            dy: dy / distance,
            speed: 7.5, // Increased speed for long-distance boss
            damage: boss.damage,
            isEnemy: true
          });
        }
        
        // Charge boss
        function prepareCharge(boss) {
          boss.isCharging = true;
          boss.chargeDistance = 300; // Increased distance
          const dx = player.x - boss.x;
          const dy = player.y - boss.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          boss.chargeDirection = { x: dx / distance, y: dy / distance };
        }
        
        // Electric bullet line
        function drawYellowLine(fromZombie, toZombie) {
          ctx.beginPath();
          ctx.strokeStyle = 'yellow';
          ctx.lineWidth = 2;
          ctx.moveTo(fromZombie.x, fromZombie.y);
          ctx.lineTo(toZombie.x, toZombie.y);
          ctx.stroke();
          setTimeout(() => drawGame(), 100); // Clear line after 100ms
        }
        
        // Utility
        function findNearestZombie(zombie, maxDistance) {
          let closest = null;
          let minDistance = maxDistance;
          zombies.forEach(other => {
            if (other !== zombie) {
              const distance = Math.sqrt((zombie.x - other.x) ** 2 + (zombie.y - other.y) ** 2);
              if (distance < minDistance) {
                minDistance = distance;
                closest = other;
              }
            }
          });
          return closest;
        }
        
        // Shop
        function buyWeapon(weapon) {
          const costs = { glock: 500, oldRifle: 500, smg: 400 };
          if (playerCoins >= costs[weapon] && !ownedWeapons.includes(weapon)) {
            playerCoins -= costs[weapon];
            ownedWeapons.push(weapon);
            currentWeapon = weapon;
            player.fireRate = weapons[currentWeapon].fireRate;
            updateCoinDisplay();
          }
        }
        
        function buyAccessory(accessory) {
          const costs = { oldMagnet: 1000, adrenaline: 500 };
          if (playerCoins >= costs[accessory] && !ownedAccessories.includes(accessory)) {
            playerCoins -= costs[accessory];
            ownedAccessories.push(accessory);
            updateCoinDisplay();
          }
        }
        
        function equipAccessory(accessory) {
          if (ownedAccessories.includes(accessory)) {
            equippedAccessory = accessory;
          }
        }
        
        function unequipAccessory() {
          equippedAccessory = null;
        }
        
        function activateAccessory() {
          if (!equippedAccessory || accessoryCooldowns[equippedAccessory] > 0) return;
          if (equippedAccessory === 'oldMagnet') {
            accessoryCooldowns.oldMagnet = 60;
            setTimeout(() => {}, 15000); // Coins collected in updateGame
          } else if (equippedAccessory === 'adrenaline') {
            player.fireRate = weapons[currentWeapon].fireRate * 0.25;
            accessoryCooldowns.adrenaline = 60;
            setTimeout(() => {
              player.fireRate = weapons[currentWeapon].fireRate;
            }, 10000);
          }
        }
        
        function updateCooldowns(deltaTime) {
          for (let accessory in accessoryCooldowns) {
            if (accessoryCooldowns[accessory] > 0) {
              accessoryCooldowns[accessory] -= deltaTime;
            }
          }
        }
        
        function updateCoinDisplay() {
          coinDisplay.textContent = playerCoins;
        }
        
        function closeShop() {
          shop.style.display = 'none';
          gameState = 'playing';
        }
        
        // Powers
        function showPowerSelection() {
          gameState = 'powerSelection';
        }
        
        function applyPower(power) {
          if (power === 'electricBullet') {
            powers.electricBullet.chance = 0.2;
          } else if (power === 'piercing') {
            powers.piercing.targets = 1;
          } else if (power === 'hpUp') {
            player.maxHealth *= 1.2;
            player.currentHealth = player.maxHealth;
            powers.hpUp.count++;
          } else if (power === 'forceUp') {
            player.damageMultiplier *= 1.05;
            powers.forceUp.count++;
          } else if (power === 'supplement') {
            if (!powers.supplement.applied) {
              player.damageMultiplier *= 1.15;
              powers.supplement.applied = true;
            }
          } else if (power === 'ricochet') {
            powers.ricochet.limit++;
          } else if (power === 'steelHeart') {
            if (!powers.steelHeart.applied) {
              player.maxHealth *= 1.3;
              player.currentHealth = player.maxHealth;
              powers.steelHeart.applied = true;
            }
          }
          powerSelection.style.display = 'none';
          gameState = 'playing';
        }
        
        // Start game
        document.addEventListener('keydown', (e) => {
          if (e.key === 'p') {
            gameState = 'shop';
          }
          if (e.key === 'e' && equippedAccessory) {
            activateAccessory();
          }
        });
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
