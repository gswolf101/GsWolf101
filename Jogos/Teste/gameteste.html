<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeRight</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }
        #game-container {
            border: 3px solid white;
            position: relative;
            width: 90vw;
            height: 70vh;
            max-width: 900px;
            max-height: 600px;
            background-color: black;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            margin-top: 20px;
        }
        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #000011;
        }
        #typing-area {
            width: 90vw;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
            margin-top: 15px;
            display: none;
        }
        #current-word {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 35px;
            color: #00ff00;
        }
        #input {
            width: 80%;
            max-width: 500px;
            background: transparent;
            border: 2px solid white;
            border-radius: 8px;
            color: white;
            font-size: 24px;
            text-align: center;
            padding: 10px;
            outline: none;
        }
        #health-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 250px;
            height: 25px;
            border: 2px solid white;
            background-color: #330000;
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }
        #health {
            height: 100%;
            background-color: red;
            width: 100%;
            transition: width 0.4s;
        }
        #score, #highscore {
            position: absolute;
            top: 15px;
            font-size: 18px;
            display: none;
        }
        #score { right: 100px; }
        #highscore { right: 15px; }
        #main-menu {
            text-align: center;
            margin-top: 15vh;
            width: 100%;
            position: relative;
        }
        #main-menu h1 {
            font-size: 56px;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #00ffff;
        }
        #main-menu button {
            padding: 15px 40px;
            background: white;
            color: black;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 24px;
        }
        #menu-back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s, color 0.3s;
        }
        #menu-back-button:hover {
            background: white;
            color: black;
        }
        #back-button {
            position: fixed;
            top: 15px;
            left: 15px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid white;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            z-index: 20;
        }
        #back-button:hover { background: rgba(255, 255, 255, 0.4); }
        #version {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-size: 14px;
            color: #aaa;
        }
        #game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            text-align: center;
        }
        #game-over h1 {
            font-size: 48px;
            color: red;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 20px;
        }
        #game-over p {
            font-size: 24px;
            color: #00ffff;
            margin-bottom: 40px;
        }
        #game-over button {
            padding: 15px 40px;
            background: white;
            color: black;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 24px;
            margin: 10px;
        }
        #game-over button:hover {
            background: #ddd;
        }
    </style>
</head>
<body>
    <div id="main-menu">
        <button id="menu-back-button" onclick="window.location.href='https://gswolf101.github.io/GsWolf101/Jogos/CentralJogos.html'">Voltar</button>
        <h1>TypeRight</h1>
        <button id="start-button">Iniciar Jogo</button>
    </div>

    <div id="game-container">
        <canvas id="canvas"></canvas>

        <div id="health-bar"><div id="health"></div></div>
        <div id="score">Pontos: 0</div>
        <div id="highscore">Recorde: 0</div>
    </div>

    <div id="typing-area">
        <div id="current-word"></div>
        <input type="text" id="input" autocomplete="off" placeholder="Digite a palavra aqui...">
    </div>

    <button id="back-button">Voltar</button>

    <div id="game-over">
        <h1>Fim de Jogo</h1>
        <p id="random-phrase"></p>
        <button id="restart-button">Reiniciar</button>
        <button id="menu-button">Voltar ao Menu</button>
    </div>

    <div id="version">V2.0</div>

    <script>
        // Elementos
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const input = document.getElementById('input');
        const currentWordDisplay = document.getElementById('current-word');
        const healthBar = document.getElementById('health');
        const scoreElem = document.getElementById('score');
        const highscoreElem = document.getElementById('highscore');
        const mainMenu = document.getElementById('main-menu');
        const typingArea = document.getElementById('typing-area');
        const healthBarDiv = document.getElementById('health-bar');
        const scoreDiv = document.getElementById('score');
        const highscoreDiv = document.getElementById('highscore');
        const backButton = document.getElementById('back-button');
        const startButton = document.getElementById('start-button');
        const gameOverDiv = document.getElementById('game-over');
        const randomPhrase = document.getElementById('random-phrase');
        const restartButton = document.getElementById('restart-button');
        const menuButton = document.getElementById('menu-button');

        // Frases aleatórias para game over
        const phrases = [
            'Você foi digitado pelos inimigos!',
            'Seu teclado falhou dessa vez...',
            'Game Over: Treine mais!',
            'Os inimigos foram mais rápidos!',
            'Tente novamente, guerreiro do teclado!',
            'Fim: Sua pontuação foi boa, mas não o suficiente!',
            'Derrota: Os códigos te venceram!'
        ];

        // Variáveis do jogo
        let player = null;
        let enemies = [];
        let projectiles = [];
        let gameActive = false;
        let enemyInterval = null;
        let score = 0;
        let healthPercent = 100;
        let maxHealth = 100;
        let highscore = 0;
        try {
            highscore = parseInt(localStorage.getItem('typeright_highscore') || '0');
        } catch (e) {
            console.warn('localStorage não disponível');
        }
        highscoreElem.innerText = `Recorde: ${highscore}`;

        const words = ['casa', 'gato', 'cachorro', 'javascript', 'programar', 'digitar', 'teclado', 'inimigo', 'fogo', 'ataque', 'mundo', 'computador', 'codigo', 'jogo', 'vitoria', 'palavra', 'velocidade', 'tiro', 'defesa', 'nave'];

        // Resize canvas
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            if (player) {
                player.x = canvas.width / 2;
                player.y = canvas.height - 80;
            }
        }
        window.addEventListener('resize', resizeCanvas);

        // Desenhar jogador
        function drawPlayer() {
            if (!player) return;
            ctx.fillStyle = '#00aaff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, 25, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - 25);
            ctx.lineTo(player.x - 25, player.y - 10);
            ctx.lineTo(player.x + 25, player.y - 10);
            ctx.closePath();
            ctx.fill();
        }

        // Criar inimigo
        function createEnemy() {
            if (!gameActive) return;
            const word = words[Math.floor(Math.random() * words.length)];
            const enemy = {
                x: Math.random() * (canvas.width - 100) + 50,
                y: -50,
                word: word,
                typed: '',
                speed: 0.7
            };
            enemies.push(enemy);
        }

        // Loop do jogo
        function updateGame() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Atualizar e desenhar inimigos
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const dist = Math.hypot(dx, dy) || 1;
                e.x += (dx / dist) * e.speed;
                e.y += (dy / dist) * e.speed;

                // Desenhar inimigo
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(e.x, e.y, 25, 0, Math.PI * 2);
                ctx.fill();

                // Palavra
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(e.word, e.x, e.y - 35);

                // Colisão com jogador
                if (Math.hypot(e.x - player.x, e.y - player.y) < 50) {
                    healthPercent -= 20;
                    updateHealth();
                    enemies.splice(i, 1);
                    if (healthPercent <= 0) {
                        gameActive = false;
                        clearInterval(enemyInterval);
                        input.disabled = true;
                        backButton.style.display = 'none';
                        typingArea.style.display = 'none';
                        showGameOver();
                    }
                }
            }

            // Projéteis
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.x += p.vx || 0;
                p.y += p.vy || -15;

                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fill();

                if (p.y < -50 || p.x < -50 || p.x > canvas.width + 50 || p.y > canvas.height + 50) {
                    projectiles.splice(i, 1);
                    continue;
                }

                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (Math.hypot(p.x - e.x, p.y - e.y) < 33) {
                        enemies.splice(j, 1);
                        projectiles.splice(i, 1);
                        score += 20;
                        updateScore();
                        break;
                    }
                }
            }

            drawPlayer();

            requestAnimationFrame(updateGame);
        }

        function updateHealth() {
            healthBar.style.width = (healthPercent / maxHealth * 100) + '%';
        }

        function updateScore() {
            scoreElem.innerText = `Pontos: ${score}`;
            if (score > highscore) {
                highscore = score;
                highscoreElem.innerText = `Recorde: ${highscore}`;
                try {
                    localStorage.setItem('typeright_highscore', highscore);
                } catch (e) {}
            }
        }

        function shoot(targetEnemy) {
            if (!targetEnemy) {
                projectiles.push({ x: player.x, y: player.y - 30, vx: 0, vy: -15 });
                return;
            }

            const dx = targetEnemy.x - player.x;
            const dy = targetEnemy.y - (player.y - 30);
            const dist = Math.hypot(dx, dy) || 1;
            const speed = 15;

            projectiles.push({
                x: player.x,
                y: player.y - 30,
                vx: (dx / dist) * speed,
                vy: (dy / dist) * speed
            });
        }

        function startGame() {
            mainMenu.style.display = 'none';
            typingArea.style.display = 'block';
            healthBarDiv.style.display = 'block';
            scoreDiv.style.display = 'block';
            highscoreDiv.style.display = 'block';
            backButton.style.display = 'block';
            gameOverDiv.style.display = 'none';

            resizeCanvas();

            player = { x: canvas.width / 2, y: canvas.height - 80 };

            enemies = [];
            projectiles = [];
            score = 0;
            healthPercent = maxHealth;
            updateHealth();
            updateScore();

            gameActive = true;
            input.disabled = false;
            input.value = '';
            currentWordDisplay.innerHTML = '';
            input.focus();

            createEnemy();
            createEnemy();

            enemyInterval = setInterval(createEnemy, 2500);

            requestAnimationFrame(updateGame);
        }

        function backToMenu() {
            gameActive = false;
            if (enemyInterval) clearInterval(enemyInterval);
            mainMenu.style.display = 'block';
            typingArea.style.display = 'none';
            healthBarDiv.style.display = 'none';
            scoreDiv.style.display = 'none';
            highscoreDiv.style.display = 'none';
            backButton.style.display = 'none';
            gameOverDiv.style.display = 'none';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function showGameOver() {
            const phrase = phrases[Math.floor(Math.random() * phrases.length)];
            randomPhrase.innerText = phrase;
            gameOverDiv.style.display = 'flex';
        }

        // Eventos
        startButton.addEventListener('click', startGame);
        backButton.addEventListener('click', backToMenu);
        restartButton.addEventListener('click', startGame);
        menuButton.addEventListener('click', backToMenu);

        // Digitação
        input.addEventListener('input', () => {
            const typed = input.value.toLowerCase().trim();
            let matched = null;

            for (const enemy of enemies) {
                if (enemy.word.toLowerCase().startsWith(typed)) {
                    matched = enemy;
                    break;
                }
            }

            if (matched) {
                currentWordDisplay.innerHTML = '<span style="color:#00ff00;">' + typed + '</span>' + matched.word.substring(typed.length);

                if (typed === matched.word.toLowerCase()) {
                    shoot(matched);
                    input.value = '';
                    currentWordDisplay.innerHTML = '';
                    // Remover o inimigo imediatamente após digitar correto
                    const index = enemies.indexOf(matched);
                    if (index > -1) {
                        enemies.splice(index, 1);
                    }
                }
            } else {
                input.value = '';
                currentWordDisplay.innerHTML = '';
            }
        });
    </script>
</body>
</html>
