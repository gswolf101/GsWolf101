<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Shooter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- Tela Inicial -->
        <div id="start-screen" class="screen active">
            <h1>Survival Shooter</h1>
            <p>Sobreviva o maior tempo possível contra inimigos!</p>
            <button onclick="startGame()">Iniciar Jogo</button>
        </div>

        <!-- Tela do Jogo -->
        <div id="game-screen" class="screen">
            <h1>Score: <span id="score">0</span></h1>
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>

        <!-- Tela de Game Over -->
        <div id="game-over-screen" class="screen">
            <h1>Game Over</h1>
            <p>Seu Score: <span id="final-score">0</span></p>
            <p>Insira seu nome:</p>
            <input type="text" id="player-name" maxlength="10">
            <button onclick="saveScore()">Salvar Score</button>
            <button onclick="showRanking()">Ver Ranking</button>
            <button onclick="restartGame()">Jogar Novamente</button>
        </div>

        <!-- Tela de Ranking -->
        <div id="ranking-screen" class="screen">
            <h1>Ranking</h1>
            <ul id="ranking-list"></ul>
            <button onclick="backToStart()">Voltar ao Início</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
